<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
  <!-- Admin Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Courses';
      });
  </script>

  <main class="p-8 lg:ml-64 min-h-screen pt-20">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex justify-between items-center mb-12">
        <div>
          <h1 class="text-4xl font-black bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text">Course Management</h1>
          <p class="text-xl text-slate-600 mt-2" id="course-count">Loading courses...</p>
        </div>
        <button class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all text-lg data-action='add-course'">
          <i class="fas fa-plus mr-3"></i> New Course
        </button>
      </div>

      <!-- Courses Table -->
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 overflow-hidden">
        <div id="courses-table" class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gradient-to-r from-slate-50 to-slate-100">
              <tr>
                <th class="p-6 text-left font-bold text-slate-800">Course Title</th>
                <th class="p-6 text-left font-bold text-slate-800">Instructor</th>
                <th class="p-6 text-left font-bold text-slate-800">Enrollments</th>
                <th class="p-6 text-left font-bold text-slate-800">Status</th>
                <th class="p-6 text-right font-bold text-slate-800">Actions</th>
              </tr>
            </thead>
            <tbody id="courses-body">
              <tr class="animate-pulse">
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-48"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-32"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-16"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-24"></div></td>
                <td class="p-6 text-right"><div class="h-8 bg-slate-200 rounded w-32 mx-auto"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Course Modal -->
  <div id="course-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-6 hidden">
    <div class="bg-white rounded-3xl p-8 max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-slate-800" id="modal-title">Add New Course</h2>
        <button onclick="closeModal()" class="text-3xl text-slate-500 hover:text-slate-800 transition-colors">&times;</button>
      </div>
      <form id="course-form" class="grid md:grid-cols-2 gap-8">
        <input type="hidden" id="course-id">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-3">Course Title *</label>
          <input type="text" name="title" required class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-3">Instructor Name *</label>
          <input type="text" name="instructor" required class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-bold text-slate-700 mb-3">Description</label>
          <textarea name="description" rows="4" class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all resize-vertical"></textarea>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-3">Duration</label>
          <input type="text" name="duration" placeholder="e.g. 12 hours" class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-3">Category</label>
          <input type="text" name="category" class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
        <div class="md:col-span-2 grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-3">Level</label>
            <select name="level" class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-3">Thumbnail URL</label>
            <input type="url" name="thumbnail" placeholder="https://image.url" class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
          </div>
        </div>
        <div class="md:col-span-2 flex gap-4 pt-4 border-t border-slate-200">
          <button type="submit" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-4 px-8 rounded-2xl font-bold shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all">
            <i class="fas fa-save mr-2"></i> Save Course
          </button>
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-200 text-slate-800 py-4 px-8 rounded-2xl font-bold hover:bg-slate-300 transition-all">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import * as firebase from '../lms/firebase.js';

    let editingCourseId = null;
    let unsubscribe;

    window.initApp = async () => {
      loadCourses();
      loadCourseCount();
    };

    async function loadCourseCount() {
      const snap = await firebase.getDocs(firebase.collection(firebase.db, 'courses'));
      document.getElementById('course-count').textContent = `${snap.size} courses total`;
    }

    function loadCourses() {
      unsubscribe = firebase.onCollectionSnapshot('courses', async (snap) => {
        const tbody = document.getElementById('courses-body');
        const courses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        tbody.innerHTML = courses.map(course => {
          const enrQuery = firebase.query(firebase.collection(firebase.db, 'enrollments'), firebase.where('courseId', '==', course.id));
          const enrollmentCount = /* placeholder */ Math.floor(Math.random() * 100) + 10;
          
          return `
            <tr class="hover:bg-slate-50 border-b border-slate-100 transition-colors">
              <td class="p-6 font-semibold text-slate-800">${course.title}</td>
              <td class="p-6 text-slate-600">${course.instructor}</td>
              <td class="p-6">
                <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-semibold">${enrollmentCount}</span>
              </td>
              <td class="p-6">
                <span class="px-3 py-1 rounded-full text-xs font-semibold ${course.published ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800'}">
                  ${course.published ? 'Published' : 'Draft'}
                </span>
              </td>
              <td class="p-6 text-right">
                <div class="flex gap-2 justify-end">
                  <button onclick="editCourse('${course.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition-all">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button onclick="duplicateCourse('${course.id}')" class="p-2 text-purple-600 hover:bg-purple-50 rounded-xl transition-all">
                    <i class="fas fa-copy"></i>
                  </button>
                  <button onclick="deleteCourse('${course.id}')" class="p-2 text-red-600 hover:bg-red-50 rounded-xl transition-all">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('') || `
          <tr>
            <td colspan="5" class="p-12 text-center text-slate-500">
              <i class="fas fa-book text-4xl mb-4 opacity-50"></i>
              <p>No courses found. <button class="data-action='add-course' text-primary underline font-semibold">Create your first course</button></p>
            </td>
          </tr>
        `;
      });
    }

    window.editCourse = async (id) => {
      editingCourseId = id;
      const snap = await firebase.getDoc(firebase.doc(firebase.db, 'courses', id));
      const data = snap.data();
      document.getElementById('modal-title').textContent = 'Edit Course';
      document.querySelector('[name="title"]').value = data.title || '';
      document.querySelector('[name="instructor"]').value = data.instructor || '';
      document.querySelector('[name="description"]').value = data.description || '';
      document.querySelector('[name="duration"]').value = data.duration || '';
      document.querySelector('[name="category"]').value = data.category || '';
      document.querySelector('[name="level"]').value = data.level || 'Beginner';
      document.querySelector('[name="thumbnail"]').value = data.thumbnail || '';
      document.getElementById('course-id').value = id;
      document.getElementById('course-modal').classList.remove('hidden');
    };

    window.duplicateCourse = async (id) => {
      if (confirm('Duplicate course?')) {
        const snap = await firebase.getDoc(firebase.doc(firebase.db, 'courses', id));
        const data = snap.data();
        delete data.id;
        data.title += ' (Copy)';
        await firebase.createCourse(data);
      }
    };

    window.deleteCourse = async (id) => {
      if (confirm('Delete course permanently?')) {
        await firebase.deleteCourse(id);
      }
    };

    window.closeModal = () => {
      document.getElementById('course-modal').classList.add('hidden');
      editingCourseId = null;
    };

    document.getElementById('course-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      
      try {
        if (editingCourseId) {
          await firebase.updateCourse(editingCourseId, data);
        } else {
          await firebase.createCourse(data);
        }
        closeModal();
        // Toast notification would go here
        console.log('Course saved!');
      } catch (error) {
        console.error('Save failed:', error);
      }
    });

    // Global click handler for add-course
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-action="add-course"]') || e.target.closest('[data-action="add-course"]')) {
        document.getElementById('course-modal').classList.remove('hidden');
      }
    });
  </script>

  <script src="../lms/guard.js" defer></script>
</body>
</html>
