<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - LearnPaddi LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
  <!-- Admin Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Dashboard';
      });
  </script>

  <main class="p-8 lg:ml-64 min-h-screen pt-20">
    <div class="max-w-7xl mx-auto px-6">
      
      <!-- Welcome & Quick Stats -->
      <div class="grid lg:grid-cols-4 gap-8 mb-12">
        <div class="lg:col-span-3 bg-white/80 backdrop-blur-xl rounded-3xl p-10 shadow-2xl border border-white/50">
          <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl flex items-center justify-center">
              <i class="fas fa-crown text-white text-xl"></i>
            </div>
            <div>
              <h1 class="text-4xl font-black bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text">Admin Dashboard</h1>
              <p class="text-xl text-slate-600 mt-1" id="last-login">Active Session</p>
            </div>
          </div>
          
          <!-- Key Metrics -->
          <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="group p-6 rounded-2xl bg-gradient-to-br from-blue-500/10 to-indigo-500/10 border border-blue-200/50 hover:shadow-xl transition-all">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-semibold text-slate-600 mb-1">Total Users</p>
                  <p class="text-3xl font-black text-blue-600" id="stat-users">1,247</p>
                </div>
                <i class="fas fa-users text-3xl text-blue-500/50 group-hover:text-blue-500 transition-all"></i>
              </div>
            </div>
            <div class="group p-6 rounded-2xl bg-gradient-to-br from-emerald-500/10 to-teal-500/10 border border-emerald-200/50 hover:shadow-xl transition-all">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-semibold text-slate-600 mb-1">Courses</p>
                  <p class="text-3xl font-black text-emerald-600" id="stat-courses">47</p>
                </div>
                <i class="fas fa-book text-3xl text-emerald-500/50 group-hover:text-emerald-500 transition-all"></i>
              </div>
            </div>
            <div class="group p-6 rounded-2xl bg-gradient-to-br from-orange-500/10 to-red-500/10 border border-orange-200/50 hover:shadow-xl transition-all">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-semibold text-slate-600 mb-1">Enrollments</p>
                  <p class="text-3xl font-black text-orange-600" id="stat-enrollments">2,847</p>
                </div>
                <i class="fas fa-chart-line text-3xl text-orange-500/50 group-hover:text-orange-500 transition-all"></i>
              </div>
            </div>
            <div class="group p-6 rounded-2xl bg-gradient-to-br from-purple-500/10 to-violet-500/10 border border-purple-200/50 hover:shadow-xl transition-all">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-semibold text-slate-600 mb-1">Certificates</p>
                  <p class="text-3xl font-black text-purple-600" id="stat-certs">1,203</p>
                </div>
                <i class="fas fa-certificate text-3xl text-purple-500/50 group-hover:text-purple-500 transition-all"></i>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50 hover:shadow-3xl transition-all">
          <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-3">
            <i class="fas fa-bolt text-orange-500"></i> Quick Actions
          </h3>
          <div class="space-y-3">
            <a href="courses.html" class="w-full block p-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-xl font-semibold text-center hover:shadow-xl hover:-translate-y-1 transition-all flex items-center justify-center gap-3">
              <i class="fas fa-plus"></i> Add Course
            </a>
            <a href="users.html" class="w-full block p-4 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-xl font-semibold text-center hover:shadow-xl hover:-translate-y-1 transition-all flex items-center justify-center gap-3">
              <i class="fas fa-users"></i> Manage Users
            </a>
            <a href="enrollments.html" class="w-full block p-4 bg-gradient-to-r from-purple-500 to-violet-500 text-white rounded-xl font-semibold text-center hover:shadow-xl hover:-translate-y-1 transition-all flex items-center justify-center gap-3">
              <i class="fas fa-chart-bar"></i> View Analytics
            </a>
          </div>
        </div>
      </div>

      <!-- Recent Activity & Charts -->
      <div class="grid lg:grid-cols-3 gap-8">
        <!-- Recent Users -->
        <div class="lg:col-span-2 bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50">
          <h3 class="text-2xl font-bold text-slate-800 mb-6">Recent Activity</h3>
          <div id="recent-activity" class="space-y-4">
            <div class="animate-pulse space-y-4">
              <div class="h-4 bg-slate-200 rounded w-3/4"></div>
              <div class="h-4 bg-slate-200 rounded w-5/6"></div>
              <div class="h-4 bg-slate-200 rounded w-1/2"></div>
            </div>
          </div>
        </div>
        
        <!-- Performance Overview -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50">
          <h3 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3">
            <i class="fas fa-chart-pie text-orange-500"></i> Platform Health
          </h3>
          <div class="text-center">
            <div class="w-24 h-24 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg">
              <i class="fas fa-check-circle text-3xl text-white"></i>
            </div>
            <p class="text-3xl font-black text-emerald-600 mb-2" id="uptime">99.9%</p>
            <p class="text-slate-600">Uptime Today</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import * as firebase from '../lms/firebase.js';

    window.initApp = async (user) => {
      // Load real-time stats
      const loadStats = async () => {
        const [usersSnap, coursesSnap, enrollSnap, certsSnap] = await Promise.all([
          firebase.getDocs(firebase.collection(firebase.db, 'users')),
          firebase.getDocs(firebase.collection(firebase.db, 'courses')),
          firebase.getDocs(firebase.collection(firebase.db, 'enrollments')),
          firebase.getDocs(firebase.collection(firebase.db, 'certificates'))
        ]);
        
        document.getElementById('stat-users').textContent = usersSnap.size;
        document.getElementById('stat-courses').textContent = coursesSnap.size;
        document.getElementById('stat-enrollments').textContent = enrollSnap.size;
        document.getElementById('stat-certs').textContent = certsSnap.size;
      };

      await loadStats();
      
      // Placeholder activity
      document.getElementById('recent-activity').innerHTML = `
        <div class="p-5 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl border-l-4 border-blue-500">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center">
              <i class="fas fa-user-plus text-white text-sm"></i>
            </div>
            <div class="flex-1">
              <p class="font-semibold text-slate-800">New user registered</p>
              <p class="text-sm text-slate-600">john.doe@example.com • 2 min ago</p>
            </div>
            <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">Live</span>
          </div>
        </div>
        <div class="p-5 bg-gradient-to-r from-emerald-50 to-teal-50 rounded-2xl border-l-4 border-emerald-500">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center">
              <i class="fas fa-certificate text-white text-sm"></i>
            </div>
            <div class="flex-1">
              <p class="font-semibold text-slate-800">Certificate issued</p>
              <p class="text-sm text-slate-600">Course: Web Development • 5 min ago</p>
            </div>
          </div>
        </div>
      `;
    };
  </script>

  <script src="../lms/guard.js" defer></script>
</body>
</html>
