<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollments - Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
  <!-- Admin Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Enrollments';
      });
  </script>

  <main class="p-8 lg:ml-64 min-h-screen pt-20">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-12">
        <div>
          <h1 class="text-4xl font-black bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text">Enrollments Analytics</h1>
          <p class="text-xl text-slate-600 mt-2" id="enrollments-count">Loading data...</p>
        </div>
        <div class="flex gap-3">
          <select id="time-filter" class="px-5 py-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option>Last 7 days</option>
            <option>Last 30 days</option>
            <option>All time</option>
          </select>
          <button class="bg-gradient-to-r from-slate-500 to-gray-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:shadow-2xl hover:-translate-y-1 whitespace-nowrap">
            <i class="fas fa-download mr-2"></i> Export Report
          </button>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="grid lg:grid-cols-4 gap-8 mb-12">
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50 text-center">
          <div class="text-4xl font-black text-emerald-600 mb-3" id="total-enrollments-stat">2,847</div>
          <p class="text-slate-600 font-semibold">Total Enrollments</p>
        </div>
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50 text-center">
          <div class="text-4xl font-black text-blue-600 mb-3" id="completion-rate">78%</div>
          <p class="text-slate-600 font-semibold">Avg Completion</p>
        </div>
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50 text-center">
          <div class="text-4xl font-black text-orange-600 mb-3" id="active-learners">847</div>
          <p class="text-slate-600 font-semibold">Active Learners</p>
        </div>
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50 text-center">
          <div class="text-4xl font-black text-purple-600 mb-3" id="certificates-stat">1,203</div>
          <p class="text-slate-600 font-semibold">Certificates Issued</p>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="grid lg:grid-cols-2 gap-8 mb-12">
        <!-- Enrollments Over Time Chart Placeholder -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50">
          <h3 class="text-2xl font-bold text-slate-800 mb-6">Enrollments Over Time</h3>
          <div class="h-80 bg-gradient-to-br from-slate-100 to-slate-200 rounded-2xl flex items-center justify-center">
            <div class="text-center text-slate-500">
              <i class="fas fa-chart-line text-6xl mb-6 opacity-50"></i>
              <p class="text-xl">Chart coming soon</p>
              <p class="text-sm">Weekly enrollment trends</p>
            </div>
          </div>
        </div>
        
        <!-- Top Courses -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/50">
          <h3 class="text-2xl font-bold text-slate-800 mb-6">Top Courses</h3>
          <div id="top-courses" class="space-y-4">
            <div class="animate-pulse space-y-4">
              <div class="h-5 bg-slate-200 rounded w-3/4"></div>
              <div class="h-5 bg-slate-200 rounded w-1/2"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Detailed Enrollments Table -->
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gradient-to-r from-slate-50 to-slate-100">
              <tr>
                <th class="p-6 text-left font-bold text-slate-800">Student</th>
                <th class="p-6 text-left font-bold text-slate-800">Course</th>
                <th class="p-6 text-left font-bold text-slate-800">Progress</th>
                <th class="p-6 text-left font-bold text-slate-800">Status</th>
                <th class="p-6 text-left font-bold text-slate-800">Enrolled</th>
                <th class="p-6 text-right font-bold text-slate-800">Actions</th>
              </tr>
            </thead>
            <tbody id="enrollments-body">
              <tr class="animate-pulse">
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-32"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-48"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-20"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-24"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-24"></div></td>
                <td class="p-6 text-right"><div class="h-8 bg-slate-200 rounded w-32 mx-auto"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import * as firebase from '../lms/firebase.js';

    window.initApp = async () => {
      loadStats();
      loadTopCourses();
      loadEnrollments();
      
      document.getElementById('time-filter').addEventListener('change', () => {
        loadStats();
      });
    };

    async function loadStats() {
      const [enrollSnap, certSnap] = await Promise.all([
        firebase.getDocs(firebase.collection(firebase.db, 'enrollments')),
        firebase.getDocs(firebase.collection(firebase.db, 'certificates'))
      ]);
      
      document.getElementById('total-enrollments-stat').textContent = enrollSnap.size;
      document.getElementById('enrollments-count').textContent = enrollSnap.size + ' enrollments';
      document.getElementById('certificates-stat').textContent = certSnap.size;
    }

    function loadTopCourses() {
      document.getElementById('top-courses').innerHTML = `
        <div class="p-6 bg-gradient-to-r from-emerald-50 to-teal-50 rounded-2xl border-l-4 border-emerald-400 group hover:shadow-lg transition-all">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-white font-bold">1</div>
            <div class="flex-1">
              <p class="font-bold text-slate-800 text-lg">React Mastery</p>
              <p class="text-sm text-emerald-700 font-semibold">847 enrollments</p>
            </div>
            <span class="px-3 py-1 bg-white text-emerald-600 rounded-full text-xs font-bold">Trending</span>
          </div>
        </div>
        <div class="p-6 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl border-l-4 border-blue-400">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center text-white font-bold">2</div>
            <div class="flex-1">
              <p class="font-bold text-slate-800 text-lg">Node.js Advanced</p>
              <p class="text-sm text-blue-700 font-semibold">623 enrollments</p>
            </div>
          </div>
        </div>
      `;
    }

    async function loadEnrollments() {
      const q = firebase.query(firebase.collection(firebase.db, 'enrollments'), firebase.orderBy('enrolledAt', 'desc'));
      // Simplified demo table
      document.getElementById('enrollments-body').innerHTML = `
        <tr class="hover:bg-slate-50 border-b border-slate-100 transition-colors">
          <td class="p-6 font-semibold">John Doe</td>
          <td class="p-6 text-slate-600">React Mastery</td>
          <td class="p-6">
            <div class="w-24 bg-slate-200 rounded-full h-2">
              <div class="bg-emerald-500 h-2 rounded-full" style="width: 78%"></div>
            </div>
            <span class="text-sm text-slate-600 ml-2">78%</span>
          </td>
          <td class="p-6">
            <span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-sm font-semibold">Completed</span>
          </td>
          <td class="p-6 text-sm text-slate-500">2024-01-15</td>
          <td class="p-6 text-right">
            <button class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl">
              <i class="fas fa-eye"></i>
            </button>
          </td>
        </tr>
        <!-- More rows... -->
      `;
    }
  </script>

  <script src="../lms/guard.js" defer></script>
</body>
</html>
