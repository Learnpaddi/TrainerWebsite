<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen">
  <!-- Admin Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Users';
      });
  </script>

  <main class="p-8 lg:ml-64 min-h-screen pt-20">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-12">
        <div>
          <h1 class="text-4xl font-black bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text">User Management</h1>
          <p class="text-xl text-slate-600 mt-2" id="users-count">Loading users...</p>
        </div>
        <div class="flex gap-3">
          <input type="text" id="user-search" placeholder="Search users by email or name..." class="flex-1 max-w-md px-5 py-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary">
          <button class="bg-gradient-to-r from-slate-500 to-gray-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:shadow-2xl hover:-translate-y-1 whitespace-nowrap">
            <i class="fas fa-download mr-2"></i> Export CSV
          </button>
        </div>
      </div>

      <!-- Users Table -->
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gradient-to-r from-slate-50 to-slate-100 sticky top-0">
              <tr>
                <th class="p-6 text-left font-bold text-slate-800">Name</th>
                <th class="p-6 text-left font-bold text-slate-800">Email</th>
                <th class="p-6 text-left font-bold text-slate-800">Role</th>
                <th class="p-6 text-left font-bold text-slate-800">Courses</th>
                <th class="p-6 text-left font-bold text-slate-800">Status</th>
                <th class="p-6 text-left font-bold text-slate-800">Joined</th>
                <th class="p-6 text-right font-bold text-slate-800">Actions</th>
              </tr>
            </thead>
            <tbody id="users-body">
              <tr class="animate-pulse">
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-32"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-64"></div></td>
                <td class="p-6"><div class="h-10 bg-slate-200 rounded w-20"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-16"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-20"></div></td>
                <td class="p-6"><div class="h-4 bg-slate-200 rounded w-24"></div></td>
                <td class="p-6 text-right"><div class="h-8 bg-slate-200 rounded w-32 mx-auto"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="p-6 border-t border-slate-200 bg-slate-50 flex items-center justify-between">
          <span id="pagination-info">Showing 1-10 of 47</span>
          <div class="flex gap-2">
            <button class="px-4 py-2 bg-white border border-slate-300 rounded-xl hover:shadow-md font-medium">Previous</button>
            <button class="px-4 py-2 bg-primary text-white border border-primary rounded-xl shadow-md font-medium">Next</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import * as firebase from '../lms/firebase.js';

    let unsubscribeUsers;

    window.initApp = async () => {
      loadUsers();
      
      // Search
      document.getElementById('user-search').addEventListener('input', debounce(loadUsers, 300));
    };

    async function loadUsers(search = '') {
      const q = firebase.query(firebase.collection(firebase.db, 'users'), 
        firebase.where('role', '!=', 'banned') // Exclude banned
      );
      
      unsubscribeUsers?.();
      unsubscribeUsers = firebase.onSnapshot(q, async (snap) => {
        const tbody = document.getElementById('users-body');
        const users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Filter client-side for demo
        const filtered = users.filter(u => 
          u.name?.toLowerCase().includes(search.toLowerCase()) || 
          u.email?.toLowerCase().includes(search.toLowerCase())
        );

        document.getElementById('users-count').textContent = `${filtered.length} users`;
        
        tbody.innerHTML = filtered.slice(0, 10).map(user => `
          <tr class="hover:bg-slate-50 border-b border-slate-100/50 transition-all group">
            <td class="p-6 font-semibold text-slate-800 group-hover:text-slate-900">${user.name || 'N/A'}</td>
            <td class="p-6 text-slate-600 max-w-xs truncate" title="${user.email}">${user.email}</td>
            <td class="p-6">
              <span class="px-3 py-1 rounded-full text-xs font-bold ${
                user.role === 'admin' ? 'bg-red-100 text-red-800' : 
                'bg-slate-100 text-slate-800'
              }">
                ${user.role === 'admin' ? 'Admin' : 'Student'}
              </span>
            </td>
            <td class="p-6">
              <span class="text-sm font-semibold text-slate-800">${user.enrolledCourses?.length || 0}</span>
            </td>
            <td class="p-6">
              <span class="px-3 py-1 rounded-full text-xs font-semibold ${
                user.lastActive ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800'
              }">
                ${user.lastActive ? 'Active' : 'Inactive'}
              </span>
            </td>
            <td class="p-6 text-sm text-slate-500">${user.createdAt?.toDate ? user.createdAt.toDate().toLocaleDateString() : 'Recent'}</td>
            <td class="p-6 text-right">
              <div class="flex gap-1.5 justify-end opacity-0 group-hover:opacity-100 transition-all">
                <button onclick="viewUser('${user.id}')" class="p-2.5 text-blue-600 hover:bg-blue-50 rounded-xl transition-all tooltip" title="View Details">
                  <i class="fas fa-eye text-sm"></i>
                </button>
                <button onclick="editRole('${user.id}')" class="p-2.5 text-amber-600 hover:bg-amber-50 rounded-xl transition-all tooltip" title="Edit Role">
                  <i class="fas fa-user-cog text-sm"></i>
                </button>
                <button onclick="banUser('${user.id}')" class="p-2.5 text-red-600 hover:bg-red-50 rounded-xl transition-all tooltip" title="Ban User">
                  <i class="fas fa-ban text-sm"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('') || `
          <tr>
            <td colspan="7" class="p-16 text-center text-slate-500">
              <i class="fas fa-users-slash text-5xl mb-6 opacity-50"></i>
              <p class="text-xl">No users found matching "${search}"</p>
            </td>
          </tr>
        `;
      });
    }

    // Action handlers
    window.viewUser = async (id) => {
      const user = await firebase.getUserDoc(id);
      alert(JSON.stringify(user, null, 2)); // Replace with modal
    };

    window.editRole = (id) => {
      const newRole = prompt('New role (student/admin):');
      if (newRole) {
        // Update Firestore user.role
        console.log(`Update ${id} role to ${newRole}`);
      }
    };

    window.banUser = (id) => {
      if (confirm('Ban this user?')) {
        // Set role: 'banned'
        console.log(`Ban user ${id}`);
      }
    };

    function debounce(func, wait) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }
  </script>

  <script src="../lms/guard.js" defer></script>
</body>
</html>
