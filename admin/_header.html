<!-- Topbar -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200 shadow-sm h-16 px-6 flex items-center justify-between lg:ml-64 transition-all">
  <div class="flex items-center justify-between w-full max-w-7xl mx-auto">
    <div class="flex items-center gap-4">
      <button class="sidebar-toggle p-2 rounded-xl hover:bg-gray-100 text-gray-700 lg:hidden" id="sidebar-toggle">
        <i class="fas fa-bars text-xl"></i>
      </button>
      <h1 class="page-title text-2xl font-bold text-gray-900 hidden lg:block" id="page-title">Admin</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <span class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-bold" id="admin-badge">ADMIN</span>
      <div class="flex items-center gap-2 p-2 rounded-xl hover:bg-gray-100 cursor-pointer group relative" id="user-dropdown">
        <div class="user-avatar w-9 h-9 bg-gradient-to-r from-red-500 to-orange-500 text-white text-sm font-bold rounded-full flex items-center justify-center" id="user-initials">A</div>
        <span id="user-name-admin" class="font-semibold hidden lg:block"></span>
        <i class="fas fa-chevron-down text-sm transition-transform group-hover:rotate-180"></i>
        <div class="absolute top-12 right-0 bg-white shadow-2xl rounded-2xl border py-2 w-56 hidden z-40" id="user-menu-dropdown">
          <div class="px-4 py-3 border-b">
            <div class="font-semibold" id="user-name">Admin</div>
            <div class="text-sm text-gray-500" id="user-email"></div>
          </div>
          <button onclick="logoutUser()" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-50 flex items-center gap-3 text-gray-700">
            <i class="fas fa-sign-out-alt w-4 text-red-500"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Mobile Overlay -->
<div class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" id="sidebar-overlay"></div>

<!-- Scripts -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Mobile sidebar toggle (same as LMS)
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebar-toggle');
  const overlay = document.getElementById('sidebar-overlay');
  const dropdown = document.getElementById('user-dropdown');
  const userMenu = document.getElementById('user-menu-dropdown');

  toggle?.addEventListener('click', () => {
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
  });
  
  overlay?.addEventListener('click', () => {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  });

  dropdown?.addEventListener('click', (e) => {
    e.stopPropagation();
    userMenu.classList.toggle('hidden');
  });

  document.addEventListener('click', () => userMenu?.classList.add('hidden'));
});
</script>

<script type="module">
window.logoutUser = async () => {
  const { logout } = await import('../lms/firebase.js');
  await logout();
};

import * as firebase from '../lms/firebase.js';

firebase.onAuthChange((user) => {
  if (user) {
    document.getElementById('user-initials').textContent = user.email.charAt(0).toUpperCase();
    document.getElementById('user-name-admin').textContent = user.displayName || user.email.split('@')[0];
    document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
    document.getElementById('user-email').textContent = user.email;
  }
});
</script>
