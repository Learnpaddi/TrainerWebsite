<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth - LearnPaddi LMS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="flex items-center justify-center min-h-[70vh] p-4">
  <div class="max-w-md w-full bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 space-y-8">
    <!-- Logo -->
    <div class="text-center">
      <img src="../images/Logo.png" alt="LearnPaddi" class="h-12 mx-auto mb-4">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Welcome Back</h1>
      <p class="text-gray-600">Sign in to your LearnPaddi account</p>
    </div>

    <!-- Tabs -->
    <div class="flex bg-gray-100 rounded-xl p-1">
      <button id="login-tab" class="flex-1 py-3 px-4 font-semibold rounded-lg bg-white shadow-sm">Login</button>
      <button id="register-tab" class="flex-1 py-3 px-4 font-semibold text-gray-600 rounded-lg">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="your@email.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-primary to-accent text-white font-bold py-4 px-6 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fas fa-sign-in-alt mr-2"></i> Sign In
      </button>
      <button type="button" id="google-login" class="w-full bg-white border-2 border-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-2xl hover:bg-gray-50 hover:border-gray-300 transition-all flex items-center justify-center gap-3">
        <i class="fab fa-google text-xl"></i> Continue with Google
      </button>
      <button type="button" id="forgot-password" class="text-sm text-primary hover:underline text-center w-full">Forgot Password?</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="space-y-6 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
        <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="reg-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-primary to-accent text-white font-bold py-4 px-6 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fas fa-user-plus mr-2"></i> Create Account
      </button>
      <button type="button" id="google-register" class="w-full bg-white border-2 border-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-2xl hover:bg-gray-50 hover:border-gray-300 transition-all flex items-center justify-center gap-3">
        <i class="fab fa-google text-xl"></i> Continue with Google
      </button>
    </form>

    <!-- Message -->
    <div id="message" class="hidden p-4 rounded-xl font-medium text-center"></div>
  </div>
</div>

<script type="module">
  import * as firebase from './firebase.js';

  // Tab switching
  document.getElementById('login-tab').onclick = () => switchForm('login');
  document.getElementById('register-tab').onclick = () => switchForm('register');
  
  function switchForm(active) {
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    
    if (active === 'login') {
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      loginTab.classList.add('bg-white', 'shadow-sm');
      loginTab.classList.remove('text-gray-600');
      registerTab.classList.remove('bg-white', 'shadow-sm');
      registerTab.classList.add('text-gray-600');
    } else {
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      registerTab.classList.add('bg-white', 'shadow-sm');
      registerTab.classList.remove('text-gray-600');
      loginTab.classList.remove('bg-white', 'shadow-sm');
      loginTab.classList.add('text-gray-600');
    }
  }

  // Forms
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    try {
      await firebase.login(email, password);
      window.location.hash = '/dashboard';
    } catch (error) {
      console.error('Login error:', error);
      const msg = errorCodeToMessage(error.code) || 'Login failed. Check connection.';
      showMessage(msg, 'error');
    }
  };

  document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    try {
      await firebase.register(email, password, name);
      window.location.hash = '/dashboard';
    } catch (error) {
      console.error('Register error:', error);
      const msg = errorCodeToMessage(error.code) || 'Registration failed.';
      showMessage(msg, 'error');
    }
  };

  // Google
  document.getElementById('google-login').onclick = () => firebase.googleLogin().then(() => window.location.hash = '/dashboard').catch(e => showMessage('Google login failed', 'error'));
  document.getElementById('google-register').onclick = () => firebase.googleLogin().then(() => window.location.hash = '/dashboard').catch(e => showMessage('Google login failed', 'error'));

  // Forgot password
  document.getElementById('forgot-password').onclick = async () => {
    const email = prompt('Enter email for reset:');
    if (email) {
      try {
        await firebase.resetPassword(email);
        showMessage('Reset email sent! Check your inbox.', 'success');
      } catch (error) {
        console.error('Reset pw error:', error);
        const msg = errorCodeToMessage(error.code) || 'Reset failed.';
        showMessage(msg, 'error');
      }
    }
  };

  function errorCodeToMessage(code) {
    const messages = {
      'auth/user-not-found': 'No account with this email. Register first?',
      'auth/wrong-password': 'Incorrect password.',
      'auth/weak-password': 'Password too weak (min 6 chars).',
      'auth/email-already-in-use': 'Email already registered. Login instead?',
      'auth/invalid-email': 'Invalid email format.',
      'auth/too-many-requests': 'Too many attempts. Try later or reset password.',
      'auth/network-request-failed': 'Network error. Check connection.',
      'auth/popup-closed-by-user': 'Login cancelled.',
      'auth/operation-not-allowed': 'Auth provider disabled. Contact support.'
    };
    return messages[code] || `Error: ${code}`;
  }

  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = `p-4 rounded-xl font-medium text-center ${type === 'error' ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'}`;
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 5000);
  }

  // Init
  switchForm('login');
</script>
