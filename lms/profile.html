<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - LearnPaddi LMS</title>
  <!-- LMS CSS System -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- SaaS Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Profile & Settings';
      });
  </script>

<main class="p-6 ml-0 lg:ml-64 bg-gray-50 min-h-screen pt-4">
    <div class="max-w-2xl mx-auto px-6">

    <!-- Profile Header -->
    <div class="bg-white rounded-3xl shadow-xl p-12 text-center mb-12">
      <div class="w-32 h-32 bg-gradient-to-br from-primary to-accent rounded-full mx-auto mb-6 flex items-center justify-center shadow-2xl">
        <i class="fas fa-user text-5xl text-white"></i>
      </div>
      <h1 id="profile-name" class="text-4xl font-black mb-2 bg-gradient-to-r from-gray-900 to-primary bg-clip-text">Loading...</h1>
      <p id="profile-email" class="text-xl text-gray-600 mb-8">Loading...</p>
      <div class="flex flex-wrap gap-4 justify-center">
        <span id="total-courses" class="bg-primary/10 text-primary px-6 py-3 rounded-2xl font-bold">0 Courses</span>
        <span id="total-progress" class="bg-accent/10 text-accent px-6 py-3 rounded-2xl font-bold">0% Complete</span>
        <span id="certificates-count" class="bg-emerald-100 text-emerald-700 px-6 py-3 rounded-2xl font-bold">0 Certificates</span>
      </div>
    </div>

    <!-- Profile Sections -->
    <div class="grid md:grid-cols-2 gap-8">
      <!-- Account Settings -->
      <div class="bg-white rounded-3xl p-8 shadow-xl">
        <h2 class="text-2xl font-bold mb-8 flex items-center gap-3">
          <i class="fas fa-cog text-primary"></i> Account Settings
        </h2>
        <form id="profile-form" class="space-y-6">
          <div>
            <label class="block text-sm font-semibold mb-2">Display Name</label>
            <input type="text" id="edit-name" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2">
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <button type="submit" class="bg-primary text-white py-3 px-6 rounded-xl font-bold hover:shadow-xl">Update Profile</button>
            <button type="button" onclick="changePassword()" class="bg-accent text-white py-3 px-6 rounded-xl font-bold hover:shadow-xl">Change Password</button>
          </div>
        </form>
      </div>

      <!-- Quick Stats -->
      <div class="bg-gradient-to-br from-primary to-accent text-white rounded-3xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold mb-8">Quick Stats</h2>
        <div class="space-y-6">
          <div class="bg-white/20 backdrop-blur-sm p-6 rounded-2xl">
            <div class="flex items-center gap-3 mb-2">
              <i class="fas fa-book text-2xl"></i>
              <span class="text-lg font-bold" id="enrolled-count">0</span>
            </div>
            <p class="opacity-90">Enrolled Courses</p>
          </div>
          <div class="bg-white/20 backdrop-blur-sm p-6 rounded-2xl">
            <div class="flex items-center gap-3 mb-2">
              <i class="fas fa-chart-line text-2xl"></i>
              <span class="text-lg font-bold" id="avg-progress">0%</span>
            </div>
            <p class="opacity-90">Average Progress</p>
          </div>
          <div class="bg-white/20 backdrop-blur-sm p-6 rounded-2xl">
            <div class="flex items-center gap-3 mb-2">
              <i class="fas fa-trophy text-2xl"></i>
              <span class="text-lg font-bold" id="awards-count">0</span>
            </div>
            <p class="opacity-90">Achievements</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="bg-white rounded-3xl shadow-xl p-8 mt-12">
      <h2 class="text-2xl font-bold mb-8 flex items-center gap-3">
        <i class="fas fa-history text-primary"></i> Recent Activity
      </h2>
      <div id="activity-list" class="space-y-4">
        <div class="text-center py-12 text-gray-500">
          <i class="fas fa-clock text-4xl mb-4 opacity-50"></i>
          <p>Loading activity...</p>
        </div>
      </div>
    </div>
  </main>

  <script type="module">

    import * as firebase from './firebase.js';

    // Auth protected by guard.js

      const userDoc = await firebase.getUserDoc(user.uid);
      document.getElementById('profile-name').textContent = userDoc?.name || user.displayName || 'User';
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('edit-name').value = userDoc?.name || user.displayName || '';

      // Load stats
      const enrollments = await firebase.getUserEnrollments(user.uid);
      const enrolledCount = enrollments.length;
      const totalProgress = enrollments.reduce((sum, e) => sum + (e.progress || 0), 0);
      const avgProgress = enrolledCount ? totalProgress / enrolledCount : 0;
      
      document.getElementById('enrolled-count').textContent = enrolledCount;
      document.getElementById('avg-progress').textContent = Math.round(avgProgress) + '%';
      document.getElementById('total-courses').textContent = enrolledCount + ' Courses';
      document.getElementById('total-progress').textContent = Math.round(avgProgress) + '% Complete';
      // certificates placeholder
      document.getElementById('certificates-count').textContent = '0 Certificates';

      // Recent activity
      const activityList = document.getElementById('activity-list');
      if (enrollments.length) {
        activityList.innerHTML = enrollments.slice(0, 5).map(enr => `
          <div class="flex gap-4 p-4 bg-gray-50 rounded-2xl hover:bg-gray-100 transition-colors">
            <div class="w-12 h-12 bg-primary/20 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fas fa-book text-primary"></i>
            </div>
            <div class="flex-1">
              <div class="font-semibold">${enr.courseTitle || 'Course'}</div>
              <div class="text-sm text-gray-500">${enr.progress}% complete</div>
            </div>
            <a href="course.html?id=${enr.courseId}" class="bg-primary text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-primary/90 whitespace-nowrap">Continue</a>
          </div>
        `).join('');
      }
    });

    // Profile update
    document.getElementById('profile-form').onsubmit = async (e) => {
      e.preventDefault();
      const user = firebase.auth.currentUser;
      if (user) {
        try {
          await firebase.auth.currentUser.updateProfile({
            displayName: document.getElementById('edit-name').value
          });
          location.reload();
        } catch (error) {
          alert('Update failed: ' + error.message);
        }
      }
    };

    window.changePassword = () => {
      const user = firebase.auth.currentUser;
      if (user) {
        const newPassword = prompt('Enter new password (min 6 chars):');
        if (newPassword && newPassword.length >= 6) {
          user.updatePassword(newPassword).then(() => {
            alert('Password updated!');
          }).catch(error => {
            alert('Update failed: ' + error.message);
          });
        }
      }
    };

    // window.logout removed - use firebase.logout() globally
  </script>

  <script src="guard.js" defer></script>
</body>
</html>
