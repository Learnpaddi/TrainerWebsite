<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LearnPaddi LMS - Home</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<script>
fetch('./_header.html')
.then(res => res.text())
.then(html => {
document.getElementById("header-placeholder").innerHTML =
html.replace("[PAGE]","Home")
})
.catch(()=>{
console.error("Header failed to load")
})
</script>

<!-- MAIN APP -->

<main id="app" class="ml-0 lg:ml-64 p-6 bg-gray-50 min-h-screen">

<div class="loading-state">

<i class="fas fa-spinner fa-spin"></i>
<p>Loading LearnPaddi courses...</p>

</div>

</main>

<!-- APP SCRIPT -->



<script src="guard.js" defer></script>



</body>
</html>
