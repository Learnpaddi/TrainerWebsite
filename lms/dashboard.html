<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LearnPaddi LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header (same as index) -->
  <header class="bg-white shadow-sm sticky top-0 z-40 border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="#/lms" class="flex items-center gap-3">
        <img src="../images/Logo.png" alt="LearnPaddi" class="h-10">
        <span class="text-2xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Dashboard</span>
      </a>
      <nav class="flex items-center gap-6">
        <a href="#/" class="text-gray-700 font-semibold flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-gray-100">
          Courses <i class="fas fa-book"></i>
        </a>
        <span id="user-name" class="text-gray-700 font-semibold"></span>
        <button class="nav-logout bg-red-500 text-white px-6 py-2 rounded-xl font-semibold hover:bg-red-600">
          Logout
        </button>
      </nav>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-12">
    <!-- Welcome -->
    <div class="text-center mb-16">
      <h1 class="text-5xl font-black mb-6 bg-gradient-to-r from-gray-900 via-primary to-accent bg-clip-text text-transparent">
        Welcome Back!
      </h1>
      <p id="welcome-text" class="text-xl text-gray-600">Loading your dashboard...</p>
    </div>

    <!-- Progress Grid -->
    <div class="grid lg:grid-cols-3 gap-8 mb-12">
      <div class="lg:col-span-2 bg-white rounded-3xl p-8 shadow-xl">
        <h2 class="text-2xl font-bold mb-8 flex items-center gap-3">
          <i class="fas fa-book-open text-primary"></i> Enrolled Courses
        </h2>
        <div id="enrolled-courses" class="space-y-6">
          <!-- Dynamic -->
        </div>
      </div>
      <div class="bg-gradient-to-br from-primary to-accent text-white rounded-3xl p-8 shadow-2xl">
        <h3 class="text-xl font-bold mb-6">Your Progress</h3>
        <div class="space-y-4">
          <div class="text-3xl font-black" id="total-progress">0%</div>
          <div class="w-full bg-white/30 rounded-full h-3">
            <div id="progress-bar" class="bg-white h-3 rounded-full transition-all" style="width:0%"></div>
          </div>
          <div id="completed-courses" class="text-sm opacity-90">0/0 Completed</div>
          <div class="flex gap-4 mt-6">
            <button class="flex-1 bg-white/20 backdrop-blur-sm px-4 py-2 rounded-xl font-semibold hover:bg-white/30">
              Certificates
            </button>
            <a href="#/admin" class="flex-1 text-center bg-white/20 backdrop-blur-sm px-4 py-2 rounded-xl font-semibold hover:bg-white/30">Admin</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Certificates -->
    <div class="bg-white rounded-3xl p-8 shadow-xl">
      <h2 class="text-2xl font-bold mb-8">Certificates</h2>
      <div id="certificates" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="text-center p-8 border-2 border-dashed border-gray-200 rounded-2xl hover:border-primary/50 transition-all">
          <i class="fas fa-certificate text-4xl text-gray-400 mb-4"></i>
          <p class="text-gray-500">No certificates yet. Complete a course!</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as firebase from './firebase.js';

    const user = firebase.auth.currentUser;
    if (!user) {
      window.location.hash = '/auth';
    }

    // Load user data
    firebase.getUserDoc(user.uid).then(userDoc => {
      document.getElementById('welcome-text').textContent = `Hello, ${userDoc?.name || user.displayName}!`;
      document.getElementById('user-name').textContent = userDoc?.name || user.email;
    });

    // Load enrollments
    firebase.getUserEnrollments(user.uid).then(enrollments => {
      const coursesDiv = document.getElementById('enrolled-courses');
      let totalProgress = 0;
      let completed = 0;
      
      enrollments.forEach(enr => {
        totalProgress += enr.progress;
        if (enr.completed) completed++;
        coursesDiv.innerHTML += `
          <div class="flex gap-6 p-6 bg-gray-50 rounded-2xl hover:bg-white transition-all">
            <div class="w-24 h-24 bg-gradient-to-br from-primary/20 to-accent/20 rounded-xl flex items-center justify-center">
              <i class="fas fa-book text-2xl text-primary"></i>
            </div>
            <div class="flex-1">
              <h3 class="font-bold text-xl mb-2">${enr.courseTitle || 'Course'}</h3>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-gradient-to-r from-primary to-accent h-2 rounded-full transition-all" style="width:${enr.progress}%"></div>
              </div>
              <p class="text-sm text-gray-500 mt-1">${Math.round(enr.progress)}% Complete</p>
            </div>
            <div class="flex flex-col gap-2 self-start">
              <a href="#/course/${enr.courseId}" class="bg-primary text-white px-6 py-2 rounded-xl font-semibold hover:bg-primary/90">Continue</a>
              ${enr.completed ? '<span class="bg-green-100 text-green-800 px-4 py-1 rounded-full text-sm font-semibold">Completed!</span>' : ''}
            </div>
          </div>
        `;
      });

      const avgProgress = enrollments.length ? totalProgress / enrollments.length : 0;
      document.getElementById('total-progress').textContent = Math.round(avgProgress) + '%';
      document.getElementById('progress-bar').style.width = avgProgress + '%';
      document.getElementById('completed-courses').textContent = `${completed}/${enrollments.length} Completed`;
    });

    // Logout
    document.querySelector('.nav-logout').onclick = () => firebase.logout().then(() => window.location.hash = '/');
  </script>
</body>
</html>
