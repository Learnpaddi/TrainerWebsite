<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Courses - LearnPaddi LMS</title>
  <!-- LMS CSS System -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- SaaS Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'My Courses';
      });
  </script>

<main class="p-6 ml-0 lg:ml-64 bg-gray-50 min-h-screen pt-4">
    <div class="max-w-7xl mx-auto px-6">

    <!-- Hero -->
    <div class="text-center mb-16">
      <h1 class="text-5xl font-black mb-6 bg-gradient-to-r from-gray-900 via-primary to-accent bg-clip-text text-transparent">
        Explore All Courses
      </h1>
      <p class="text-xl text-gray-600 max-w-2xl mx-auto">Discover 50+ demo courses across 10 categories. Start learning today.</p>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-3xl shadow-xl p-6 mb-12">
      <div class="flex flex-wrap gap-4 items-center">
        <select id="category-filter" class="px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2">
          <option>All Categories</option>
        </select>
        <select id="level-filter" class="px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2">
          <option>All Levels</option>
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
        <div class="flex-1"></div>
        <span id="course-count" class="text-gray-500 font-semibold">Loading...</span>
      </div>
    </div>

    <!-- Courses Grid -->
    <div id="courses-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Dynamic loaded -->
    </div>
  </main>

  <script type="module">

    import * as firebase from './firebase.js';

    const coursesGrid = document.getElementById('courses-grid');
    const countSpan = document.getElementById('course-count');
    
    // Load all courses
    async function loadCourses() {
      try {
        const courses = await firebase.getCourses();
        countSpan.textContent = `${courses.length} courses`;
        
        // Load enrollments for buttons
        const enrollments = await firebase.getUserEnrollments(window.currentUser.uid);
        const enrollmentMap = new Map(enrollments.map(e => [e.courseId, e]));
        
        coursesGrid.innerHTML = courses.map(course => {
          const courseId = course.courseId || course.id;
          const enrollment = enrollmentMap.get(courseId);
          const btnText = enrollment ? 'Continue Course' : 'Enroll Now';
          const btnClass = enrollment?.completed ? 'from-emerald-500 to-teal-500' : 'from-primary to-accent';
          const btnIcon = enrollment?.completed ? 'fas fa-certificate' : 'fas fa-arrow-right';
          const href = enrollment ? `course.html?id=${courseId}` : '#';
          const onclick = enrollment ? '' : `enrollCourse('${courseId}')`;
          
          return `
          <div class="group bg-white rounded-3xl p-8 shadow-xl hover:shadow-2xl hover:-translate-y-3 transition-all border hover:border-primary/30">
            <img src="${course.thumbnail}" alt="${course.title}" class="w-full h-48 object-cover rounded-2xl mb-6 group-hover:scale-105 transition-transform">
            <div class="flex gap-2 text-xs bg-gray-100 px-3 py-1 rounded-full mb-4">
              <span class="text-primary font-semibold">${course.category}</span>
            </div>
            <h3 class="text-2xl font-bold mb-4">${course.title}</h3>
            <p class="text-gray-600 mb-6">${course.description.substring(0,120)}...</p>
            <div class="flex gap-4 mb-8 text-sm text-gray-500">
              <span><i class="fas fa-clock mr-1"></i>${course.duration}</span>
              <span><i class="fas fa-user mr-1"></i>${course.instructor}</span>
              <span><i class="fas fa-level-up-alt mr-1"></i>${course.level}</span>
              ${enrollment ? `<span><i class="fas fa-chart-line mr-1"></i>${enrollment.progress}%</span>` : ''}
            </div>
            <button ${onclick ? 'onclick=' + onclick : ''} href="${href}" class="block w-full bg-gradient-to-r ${btnClass} text-white py-4 px-8 rounded-2xl font-bold text-center hover:shadow-xl hover:-translate-y-1 transition-all ${enrollment?.completed ? '' : 'cursor-pointer'}">
              ${btnText} <i class="${btnIcon} ml-2"></i>
            </button>
          </div>
          `;
        }).join('');
      } catch (error) {
        coursesGrid.innerHTML = '<p class="text-center text-red-500 col-span-full text-xl">Error loading courses. <button onclick="loadCourses()" class="underline ml-2">Retry</button></p>';
      }
    }

    // Global enroll handler
    window.enrollCourse = async (courseId) => {
      if (!window.currentUser) {
        alert('Please log in to enroll');
        return location.href = '/login.html';
      }
      
      try {
        const enrollment = await firebase.enrollIfNotExists(window.currentUser.uid, courseId);
        showNotification('✅ Enrolled successfully! Continue learning.');
        loadCourses(); // Refresh
      } catch (error) {
        console.error('Enroll failed:', error);
        showNotification('Enrollment failed. Try again.', 'error');
      }
    };

    // UI utils
    function showNotification(msg, type = 'success') {
      // Simple toast
      const toast = document.createElement('div');
      toast.className = `fixed top-4 right-4 p-4 rounded-2xl shadow-2xl z-50 transform translate-x-full transition-all ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'} text-white font-semibold`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      
      setTimeout(() => toast.classList.remove('translate-x-full'), 100);
      setTimeout(() => {
        toast.classList.add('translate-x-full');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    loadCourses();
  </script>

  <script src="guard.js" defer></script>
</body>
</html>
