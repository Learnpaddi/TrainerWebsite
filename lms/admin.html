<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - LearnPaddi LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Admin Dashboard';
      });
  </script>

<main class="p-6 ml-0 lg:ml-64 bg-gray-50 min-h-screen pt-4">
    <div class="max-w-7xl mx-auto px-6">
      <script>
        window.location.href = 'admin/courses.html';
      </script>

      <!-- Stats -->
      <div class="grid lg:grid-cols-4 md:grid-cols-2 gap-6 mb-12">
        <div class="bg-white p-8 rounded-2xl shadow-xl hover:shadow-2xl transition-all group">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-3xl font-black text-primary" id="total-students">Loading...</p>
              <p class="text-gray-600 font-semibold">Students</p>
            </div>
            <i class="fas fa-users text-4xl text-primary/20 group-hover:text-primary transition-all"></i>
          </div>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow-xl hover:shadow-2xl transition-all group">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-3xl font-black text-emerald-600" id="total-courses">Loading...</p>
              <p class="text-gray-600 font-semibold">Courses</p>
            </div>
            <i class="fas fa-book text-4xl text-emerald-500/20 group-hover:text-emerald-500 transition-all"></i>
          </div>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow-xl hover:shadow-2xl transition-all group">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-3xl font-black text-orange-600" id="total-enrollments">Loading...</p>
              <p class="text-gray-600 font-semibold">Enrollments</p>
            </div>
            <i class="fas fa-chart-line text-4xl text-orange-500/20 group-hover:text-orange-500 transition-all"></i>
          </div>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow-xl hover:shadow-2xl transition-all group">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-3xl font-black text-purple-600" id="total-certs">Loading...</p>
              <p class="text-gray-600 font-semibold">Certificates</p>
            </div>
            <i class="fas fa-certificate text-4xl text-purple-500/20 group-hover:text-purple-500 transition-all"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="p-8">
          <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold">Manage Courses</h2>
            <button class="bg-gradient-to-r from-primary to-accent text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:shadow-xl data-action='add-course'">
              <i class="fas fa-plus mr-2"></i> Add Course
            </button>
          </div>
          <div id="courses-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            Loading...
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="course-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-6">
    <div class="bg-white rounded-3xl p-8 max-w-2xl w-full shadow-2xl">
      <h3 class="text-2xl font-bold mb-8" id="modal-title">Add New Course</h3>
      <form id="course-form" class="space-y-6">
        <input type="hidden" id="course-id">
        <div>
          <label class="block text-sm font-bold mb-2">Title</label>
          <input type="text" name="title" required class="w-full p-4 border rounded-xl">
        </div>
        <div>
          <label class="block text-sm font-bold mb-2">Description</label>
          <textarea name="description" rows="3" class="w-full p-4 border rounded-xl"></textarea>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <input type="text" name="instructor" placeholder="Instructor">
          <input type="text" name="duration" placeholder="Duration">
        </div>
        <div class="flex gap-4">
          <button type="submit" class="flex-1 bg-emerald-500 text-white py-4 rounded-xl font-bold">Save</button>
          <button type="button" class="flex-1 bg-gray-200 py-4 rounded-xl font-bold">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import * as firebase from './firebase.js';
    import { showNotification } from './app.js';

    let editingCourseId = null;

    // Guard
    firebase.onAuthChange(async (user) => {
      if (!user) return window.location.href = '/login.html';
      const role = await firebase.getUserRole(user.uid);
      if (role !== 'admin') {
        showNotification('Admin only', 'error');
        window.location.hash = '/dashboard';
        return;
      }
      initAdmin();
    });

    async function initAdmin() {
      await loadStats();
      loadCoursesRealtime();
      document.addEventListener('click', handleActions);
    }

    async function loadStats() {
      const cols = ['users', 'courses', 'enrollments', 'certificates'];
      cols.forEach(async (col, i) => {
        try {
          const snap = await firebase.getDocs(collection(firebase.db, col));
          document.getElementById(['total-students','total-courses','total-enrollments','total-certs'][i]).textContent = snap.size;
        } catch (e) { /* ignore */ }
      });
    }

    let unsubscribe;
    function loadCoursesRealtime() {
      unsubscribe = firebase.onCollectionSnapshot('courses', snap => {
        const list = document.getElementById('courses-list');
        list.innerHTML = snap.docs.map(d => {
          const c = d.data();
          return `<div class="p-6 border rounded-2xl hover:shadow-lg">
            <h4 class="font-bold mb-2">${c.title}</h4>
            <p>${c.description?.slice(0,80)}...</p>
            <div class="flex gap-2 mt-4">
              <button data-action="edit" data-id="${d.id}" class="flex-1 bg-blue-500 text-white py-2 rounded">Edit</button>
              <button data-action="delete" data-id="${d.id}" class="flex-1 bg-red-500 text-white py-2 rounded">Delete</button>
            </div>
          </div>`;
        }).join('') || '<p>No courses</p>';
      });
    }

    function handleActions(e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === 'add-course') openModal(null);
      if (action === 'edit') editCourse(id);
      if (action === 'delete') deleteCourse(id);
    }

    async function editCourse(id) {
      editingCourseId = id;
      const snap = await firebase.getDoc(doc(firebase.db, 'courses', id));
      const data = snap.data();
      document.querySelector('#modal-title').textContent = 'Edit Course';
      document.querySelector('[name="title"]').value = data.title;
      document.querySelector('[name="description"]').value = data.description;
      document.querySelector('[name="instructor"]').value = data.instructor;
      document.querySelector('[name="duration"]').value = data.duration;
      document.querySelector('#course-id').value = id;
      document.getElementById('course-modal').classList.remove('hidden');
    }

    async function deleteCourse(id) {
      if (!confirm('Delete?')) return;
      try {
        await firebase.deleteCourse(id);
      } catch (e) {
        showNotification('Delete failed', 'error');
      }
    }

    function openModal(id) {
      editingCourseId = id;
      document.getElementById('modal-title').textContent = id ? 'Edit' : 'Add Course';
      document.getElementById('course-form').reset();
      document.getElementById('course-modal').classList.remove('hidden');
    }

    window.closeCourseModal = () => document.getElementById('course-modal').classList.add('hidden');

    document.getElementById('course-form').addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      try {
        if (editingCourseId) {
          await firebase.updateCourse(editingCourseId, data);
        } else {
          await firebase.createCourse(data);
        }
        window.closeCourseModal();
        showNotification('Saved!');
      } catch (e) {
        showNotification('Error: ' + e.message, 'error');
      }
    });
  </script>
</body>
</html>
