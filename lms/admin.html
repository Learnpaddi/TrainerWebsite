<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - LearnPaddi LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm sticky top-0 z-40 border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="#/" class="flex items-center gap-3">
        <img src="../images/Logo.png" alt="LearnPaddi" class="h-10">
        <span class="text-2xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Admin</span>
      </a>
      <nav class="flex items-center gap-4">
        <a href="#/dashboard" class="text-gray-700 font-semibold px-4 py-2 rounded-lg hover:bg-gray-100">Dashboard</a>
        <button class="nav-logout bg-red-500 text-white px-6 py-2 rounded-xl font-semibold hover:bg-red-600">Logout</button>
      </nav>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-black mb-12 bg-gradient-to-r from-gray-900 to-primary bg-clip-text text-transparent flex items-center gap-4">
      <i class="fas fa-cog text-3xl"></i> Admin Dashboard
    </h1>

    <!-- Stats Cards -->
    <div class="grid lg:grid-cols-4 md:grid-cols-2 gap-6 mb-12">
      <div class="bg-white p-8 rounded-2xl shadow-xl group hover:shadow-2xl transition-all">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-3xl font-black text-primary" id="total-students">0</p>
            <p class="text-gray-600 font-semibold">Students</p>
          </div>
          <i class="fas fa-users text-4xl text-primary/20 group-hover:text-primary transition-all"></i>
        </div>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-xl group hover:shadow-2xl transition-all">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-3xl font-black text-emerald-600" id="total-courses">0</p>
            <p class="text-gray-600 font-semibold">Courses</p>
          </div>
          <i class="fas fa-book text-4xl text-emerald-500/20 group-hover:text-emerald-500 transition-all"></i>
        </div>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-xl group hover:shadow-2xl transition-all">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-3xl font-black text-orange-600" id="total-enrollments">0</p>
            <p class="text-gray-600 font-semibold">Enrollments</p>
          </div>
          <i class="fas fa-chart-line text-4xl text-orange-500/20 group-hover:text-orange-500 transition-all"></i>
        </div>
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-xl group hover:shadow-2xl transition-all">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-3xl font-black text-purple-600" id="total-certs">0</p>
            <p class="text-gray-600 font-semibold">Certificates</p>
          </div>
          <i class="fas fa-certificate text-4xl text-purple-500/20 group-hover:text-purple-500 transition-all"></i>
        </div>
      </div>
    </div>

    <!-- Management Tabs -->
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-12">
      <div class="border-b flex">
        <button class="flex-1 py-6 px-8 font-bold text-lg border-b-4 border-primary" onclick="showTab('courses')">Courses</button>
        <button class="flex-1 py-6 px-8 font-semibold text-gray-600" onclick="showTab('users')">Users</button>
        <button class="flex-1 py-6 px-8 font-semibold text-gray-600" onclick="showTab('analytics')">Analytics</button>
      </div>
      <div id="tab-content">
        <!-- Courses Tab -->
        <div id="courses-tab">
          <div class="p-8">
            <div class="flex justify-between items-center mb-8">
              <h2 class="text-2xl font-bold">Manage Courses</h2>
              <button onclick="openCourseModal()" class="bg-gradient-to-r from-primary to-accent text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:shadow-xl">
                <i class="fas fa-plus mr-2"></i> Add Course
              </button>
            </div>
            <div id="courses-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              <!-- Dynamic courses -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Course Modal -->
    <div id="course-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-6">
      <div class="bg-white rounded-3xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <h3 class="text-2xl font-bold mb-8">Add New Course</h3>
        <form id="course-form" class="space-y-6">
          <div>
            <label class="block text-sm font-bold mb-2">Title</label>
            <input type="text" name="title" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20" required>
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">Description</label>
            <textarea name="description" rows="3" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20"></textarea>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <input type="text" name="instructor" placeholder="Instructor" class="p-4 border border-gray-200 rounded-xl">
            <input type="text" name="duration" placeholder="Duration (e.g. 8 hours)" class="p-4 border border-gray-200 rounded-xl">
          </div>
          <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-4 px-6 rounded-xl font-bold shadow-lg hover:shadow-xl">Create Course</button>
            <button type="button" onclick="closeCourseModal()" class="flex-1 bg-gray-200 text-gray-700 py-4 px-6 rounded-xl font-bold hover:bg-gray-300">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import * as firebase from './firebase.js';
    import { appUtils } from './app.js';

    // Admin guard (simple: check if admin email or UID)
    firebase.auth.onAuthStateChanged(user => {
      if (!user || user.email !== 'admin@learnpaddi.in') { // Replace with real check
        window.location.hash = '/dashboard';
      }
    });

    // Load stats realtime
    ['users', 'courses', 'enrollments', 'certificates'].forEach(async (col, idx) => {
      const snap = await firebase.db.collection(col).get();
      document.getElementById(['total-students','total-courses','total-enrollments','total-certs'][idx]).textContent = snap.size;
    });

    // Courses tab
    firebase.db.collection('courses').onSnapshot(snap => {
      const list = document.getElementById('courses-list');
      list.innerHTML = snap.docs.map(doc => {
        const c = doc.data();
        return `
          <div class="p-6 border rounded-2xl hover:shadow-lg transition-all group">
            <h4 class="font-bold text-xl mb-2">${c.title}</h4>
            <p class="text-gray-600 mb-4">${c.description.substring(0,80)}...</p>
            <div class="flex gap-2 text-sm text-gray-500 mb-4">
              <span>${c.duration}</span> • <span>${c.instructor}</span>
            </div>
            <div class="flex gap-2">
              <button onclick="editCourse('${doc.id}')" class="flex-1 bg-primary/80 text-white py-2 px-4 rounded-lg font-semibold hover:bg-primary">Edit</button>
              <button onclick="deleteCourse('${doc.id}')" class="flex-1 bg-red-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-red-600">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    });

    // Forms
    document.getElementById('course-form').onsubmit = async e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const course = Object.fromEntries(formData);
      try {
        await firebase.db.collection('courses').add(course);
        appUtils.showNotification('Course created!');
        closeCourseModal();
        e.target.reset();
      } catch (err) {
        appUtils.showNotification('Error: ' + err.message, 'error');
      }
    };

    window.openCourseModal = () => document.getElementById('course-modal').classList.remove('hidden');
    window.closeCourseModal = () => document.getElementById('course-modal').classList.add('hidden');

    window.showTab = tab => {
      // Tab logic (courses/users/analytics)
    };

    window.editCourse = id => {
      // Pre-fill form
    };

    window.deleteCourse = async id => {
      if (confirm('Delete course?')) {
        await firebase.db.collection('courses').doc(id).delete();
      }
    };
  </script>
</body>
</html>
