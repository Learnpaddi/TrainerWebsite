<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course - LearnPaddi LMS</title>
  <!-- LMS CSS System -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Video.js CDN -->
  <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- SaaS Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('./_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Course Player';
      });
  </script>

<main class="p-6 ml-0 lg:ml-64 bg-gray-50 min-h-screen pt-4">
    <div class="max-w-5xl mx-auto px-6">

    <!-- Course Header -->
    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 mb-12">
      <div class="flex flex-col lg:flex-row gap-8 items-start lg:items-center">
        <img id="course-thumbnail" src="" alt="" class="w-full lg:w-64 h-48 object-cover rounded-2xl flex-shrink-0">
        <div class="flex-1">
          <div class="flex flex-wrap gap-4 mb-4 text-sm text-gray-500">
            <span id="course-instructor"></span>
            <span id="course-duration"></span>
            <span id="course-level"></span>
          </div>
          <h1 id="course-title" class="text-4xl font-black mb-4 bg-gradient-to-r from-gray-900 to-primary bg-clip-text"></h1>
          <p id="course-desc" class="text-xl text-gray-600 mb-6"></p>
          <div class="flex gap-4">
            <button id="mark-complete" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-8 py-3 rounded-2xl font-bold hover:shadow-xl">
              <i class="fas fa-check mr-2"></i> Mark Complete
            </button>
            <button id="take-quiz" class="bg-primary text-white px-8 py-3 rounded-2xl font-bold hover:shadow-xl" style="display:none;">
              Take Quiz
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lessons Sidebar + Content -->
    <div class="grid lg:grid-cols-4 gap-8">
      <!-- Lessons List -->
      <div class="lg:col-span-1 bg-white rounded-3xl shadow-xl p-6 sticky top-24 h-fit">
        <h3 class="font-bold text-xl mb-6 flex items-center gap-2">
          <i class="fas fa-list text-primary"></i> Lessons ( <span id="lesson-count">0</span> )
        </h3>
        <div id="lessons-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
      </div>

      <!-- Main Content -->
      <div class="lg:col-span-3">
        <div id="lesson-content" class="bg-white rounded-3xl shadow-xl p-8 min-h-[400px] flex items-center justify-center text-gray-500">
          <div class="text-center">
            <i class="fas fa-play-circle text-6xl mb-6 opacity-50"></i>
            <h2 class="text-2xl font-bold mb-2">Select a lesson to begin</h2>
            <p>Click a lesson from the sidebar to start learning</p>
          </div>
        </div>

        <!-- Quiz Modal -->
        <div id="quiz-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
          <div class="bg-white rounded-3xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
              <h2 class="text-2xl font-bold">Final Quiz</h2>
              <button onclick="closeQuiz()" class="text-2xl">&times;</button>
            </div>
            <div id="quiz-questions"></div>
            <div class="mt-8 pt-8 border-t flex justify-between">
              <span id="quiz-score"></span>
              <button id="submit-quiz" class="bg-gradient-to-r from-primary to-accent text-white px-8 py-3 rounded-2xl font-bold">Submit Quiz</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">

    import * as firebase from './firebase.js';

    // Parse courseId from URL (?id=xxx or #id=xxx)
    const urlParams = new URLSearchParams(window.location.search.length > 1 ? window.location.search.slice(1) : window.location.hash.slice(1));
    const courseId = urlParams.get('id') || 'demo-course-1'; // Fallback
    
    let courseData = {};
    let currentEnrollment = null;
    let currentLesson = 0;
    let lessonProgress = new Set(); // Local cache
    let totalLessons = 0;
    let quizAttempts = 0;

    // Wait for auth then init
    window.initApp = async () => {
      if (!window.currentUser) return;
      
      // Auto-enroll if needed
      currentEnrollment = await firebase.enrollIfNotExists(window.currentUser.uid, courseId);
      
      // Load course data (stable)
      const courseSnap = await firebase.getDoc(firebase.doc(firebase.db, 'courses', courseId));
      if (!courseSnap.exists()) {
        document.getElementById('lesson-content').innerHTML = '<div class="text-center p-12"><h2 class="text-2xl font-bold text-red-500 mb-4">Course not found</h2><a href="courses.html" class="text-primary underline">← Back to Courses</a></div>';
        return;
      }
      courseData = courseSnap.data();
      
      // Real-time enrollment listener
      const unsub = firebase.onSnapshot(firebase.doc(firebase.db, 'enrollments', currentEnrollment.id), (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          currentEnrollment = { id: currentEnrollment.id, ...data };
          totalLessons = data.totalLessons || courseData.modules.reduce((sum, mod) => sum + (mod.lessons ? mod.lessons.length : 1), 0);
          lessonProgress = new Set(data.completedLessons || []);
          
          // Refresh UI
          document.getElementById('lesson-count').textContent = totalLessons;
          populateCourse(courseData);
          updateProgressBar();
          
          // Quiz unlock
          if (data.quizUnlocked && courseData.quiz) {
            document.getElementById('take-quiz').style.display = 'block';
          }
        }
      });
      
      // Cleanup on unload
      window.addEventListener('beforeunload', unsub);
    };

// Cleanup old title set (done in header load)
    // document.getElementById('page-title').textContent = 'Loading Course...'; // Fallback

    // Enrollment loaded via guard.js protection + firebase utils (v9+ syntax fixed elsewhere)

    function populateCourse(course) {
      document.getElementById('course-title').textContent = course.title;
      document.getElementById('course-desc').textContent = course.description;
      document.getElementById('course-instructor').innerHTML = `<i class="fas fa-user mr-2"></i> ${course.instructor}`;
      document.getElementById('course-duration').innerHTML = `<i class="fas fa-clock mr-2"></i> ${course.duration}`;
      document.getElementById('course-level').innerHTML = `<i class="fas fa-level-up-alt mr-2"></i> ${course.level}`;
      document.getElementById('course-thumbnail').src = course.thumbnail || '../images/Logo.png';

      // Flatten lessons for flat index 0..total-1
      const allLessons = [];
      course.modules.forEach(mod => {
        if (mod.lessons && mod.lessons.length) {
          mod.lessons.forEach(lesson => allLessons.push({ ...lesson, moduleTitle: mod.title }));
        } else {
          allLessons.push({ title: mod.title, moduleTitle: 'Introduction', duration: 30 });
        }
      });

      // Lessons list
      const list = document.getElementById('lessons-list');
      list.innerHTML = '';
      allLessons.forEach((lesson, idx) => {
        const completed = lessonProgress.has(idx);
        const active = idx === currentLesson;
        list.innerHTML += `
          <button onclick="loadLesson(${idx})" class="w-full text-left p-4 rounded-xl hover:bg-primary/10 transition-all flex items-center gap-3 ${active ? 'bg-primary/20 border-2 border-primary/50 font-semibold shadow-md' : completed ? 'bg-emerald-50 text-emerald-800' : ''}">
            <i class="fas fa-${active ? 'play-circle' : completed ? 'check-circle' : 'circle-thin'} ${active ? 'text-primary' : completed ? 'text-emerald-500' : 'text-gray-400'}"></i>
            <div class="flex-1 min-w-0">
              <span class="font-medium truncate">${lesson.title}</span>
              <span class="text-xs text-gray-500 ml-2">(${lesson.duration}m)</span>
            </div>
            ${completed ? '<i class="fas fa-check ml-auto text-emerald-500"></i>' : ''}
          </button>
        `;
      });
    }

    // Remove duplicate/older loadLesson

    // Progress bar (uses cached totalLessons)
    async function updateProgressBar() {
      const completedCount = lessonProgress.size;
      const progress = totalLessons ? Math.round((completedCount / totalLessons) * 100) : 0;
      
      if (currentEnrollment) {
        await firebase.updateProgress(currentEnrollment.id, progress);
        if (progress === 100 && courseData.quiz && !currentEnrollment.quizUnlocked) {
          await firebase.unlockQuiz(currentEnrollment.id);
          document.getElementById('take-quiz').style.display = 'block';
        }
      }
      
      // Update header progress
      const progressEl = document.getElementById('course-progress') || document.createElement('div');
      progressEl.id = 'course-progress';
      progressEl.className = 'text-2xl font-bold text-primary mb-4';
      progressEl.textContent = `${progress}% Complete (${completedCount}/${totalLessons})`;
      if (!document.getElementById('course-progress')) {
        const btnContainer = document.querySelector('.flex.gap-4');
        if (btnContainer) btnContainer.parentNode.insertBefore(progressEl, btnContainer);
      }
    }

    window.loadLesson = async (index) => {
      currentLesson = index;
      const allLessons = []; // Rebuild flat list
      courseData.modules.forEach(mod => {
        if (mod.lessons) mod.lessons.forEach(l => allLessons.push(l));
      });
      const lesson = allLessons[index] || { title: 'Lesson', description: 'Content', duration: 30 };
      
      document.getElementById('lesson-content').innerHTML = `
        <div class="w-full space-y-6">
          <video class="w-full rounded-2xl shadow-xl" controls preload="metadata" poster="https://picsum.photos/800/450?random=${index}">
            <source src="${lesson.videoUrl || 'https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4'}" type="video/mp4">
            Video placeholder.
          </video>
          <div>
            <h3 class="text-2xl font-bold mb-4">${lesson.title}</h3>
            <p class="text-lg text-gray-700">${lesson.description}</p>
          </div>
          <button id="complete-btn-${index}" onclick="completeLesson(${index})" class="bg-emerald-500 text-white px-8 py-3 rounded-2xl font-bold hover:shadow-xl flex items-center gap-2 ${lessonProgress.has(index) ? 'bg-gray-500 cursor-not-allowed' : ''}">
            <i class="fas fa-check"></i> ${lessonProgress.has(index) ? 'Completed ✓' : 'Mark Complete & Next'}
          </button>
        </div>
      `;
      
      updateLessonButtons();
    };

    window.completeLesson = async (lessonIndex) => {
      if (lessonProgress.has(lessonIndex)) return;
      
      lessonProgress.add(lessonIndex);
      await firebase.completeLesson(currentEnrollment.id, lessonIndex);
      await updateProgressBar();
      showNotification('✅ Lesson completed & saved!');
      
      // Auto next
      const nextIdx = lessonIndex + 1;
      if (nextIdx < totalLessons) {
        loadLesson(nextIdx);
      }
    };

    // Update lesson buttons (active/completed)
    function updateLessonButtons() {
      document.querySelectorAll('#lessons-list button').forEach((btn, idx) => {
        const completed = lessonProgress.has(idx);
        btn.innerHTML = `
          <i class="fas fa-${currentLesson === idx ? 'play' : completed ? 'check-circle text-emerald-500' : 'circle'}"></i>
          <span>${courseData.modules[Math.floor(idx/3)]?.title || ''} - Lesson ${idx%3 +1}</span>
          ${completed ? '<i class="fas fa-check ml-auto text-emerald-500"></i>' : ''}
        `;
        btn.classList.toggle('bg-primary/20', idx === currentLesson);
        btn.classList.toggle('opacity-75', completed);
      });
    }

    // Quiz
    document.getElementById('take-quiz').onclick = async () => {
      if (!currentEnrollment.quizUnlocked) {
        showNotification('Complete all lessons first!', 'error');
        return;
      }
      if (!courseData.quiz?.questions || courseData.quiz.questions.length !== 10) {
        showNotification('Quiz not ready (10 questions required)', 'error');
        return;
      }
      
      const questions = courseData.quiz.questions;
      let qidx = 0;
      document.getElementById('quiz-questions').innerHTML = `
        <div id="current-question" class="mb-6 p-6 border-2 border-primary/30 rounded-2xl bg-primary/5">
          <div class="flex justify-between mb-4">
            <span class="font-bold">Q<span id="q-number">1</span>/10</span>
            <button onclick="retryQuiz()" class="text-sm text-gray-500 underline hover:text-gray-700">Retry Quiz</button>
          </div>
          <h4 id="quiz-question" class="font-bold mb-6 text-xl">${questions[0].q}</h4>
          <div id="quiz-options"></div>
          <button id="next-question" class="mt-8 bg-primary text-white px-8 py-3 rounded-xl font-bold hover:shadow-xl w-full">
            Next Question
          </button>
        </div>
      `;
      renderQuizOptions(0);
      document.getElementById('quiz-score').innerHTML = '<button id="start-quiz-retry" class="text-sm text-blue-500 underline">Quiz Retries: <span id="attempt-count">0</span></button>';
      document.getElementById('quiz-modal').classList.remove('hidden');
    };

    // Progressive quiz functions
    window.renderQuizOptions = (qidx) => {
      const questions = courseData.quiz.questions;
      if (qidx >= 10) return showQuizResult();
      document.getElementById('q-number').textContent = qidx + 1;
      document.getElementById('quiz-question').textContent = questions[qidx].q;
      document.getElementById('quiz-options').innerHTML = questions[qidx].options.map((opt, j) => 
        `<label class="block p-4 border rounded-xl cursor-pointer hover:border-primary/50 mb-3 bg-white shadow-sm">
          <input type="radio" name="q${qidx}" value="${j}" class="mr-3 w-4 h-4 text-primary"> ${opt}
        </label>`
      ).join('');
      document.getElementById('next-question').onclick = () => nextQuizQuestion();
    };

    window.nextQuizQuestion = () => {
      const selected = document.querySelector(`input[name="q${currentQuizIdx}"]:checked`);
      if (!selected) return showNotification('Please select an answer', 'error');
      currentQuizIdx++;
      renderQuizOptions(currentQuizIdx);
    };

    let currentQuizIdx = 0;
    window.retryQuiz = () => {
      currentQuizIdx = 0;
      renderQuizOptions(0);
    };

    window.showQuizResult = async () => {
      let score = 0;
      courseData.quiz.questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && parseInt(selected.value) === q.correct) score++;
      });
      
      const result = await firebase.submitQuiz(currentEnrollment.id, score, 10);
      document.getElementById('quiz-score').innerHTML = `
        <div class="text-2xl font-bold text-center mb-6">
          Score: <span class="text-3xl ${result.passed ? 'text-emerald-500' : 'text-red-500'}">${score}/10</span> 
          (${Math.round((score/10)*100)}%)
        </div>
        ${result.passed ? '<div class="text-emerald-500 text-xl">🎉 Passed! Certificate ready.</div>' : '<div class="text-red-500 text-xl">Try again!</div>'}
        <div class="flex gap-4 mt-6">
          <button onclick="window.open(\`certificate.html?cert=${result.certId}\`, '_blank')" class="flex-1 bg-emerald-500 text-white py-3 px-6 rounded-xl font-bold">View Certificate</button>
          <button onclick="retryQuiz()" class="flex-1 bg-gray-500 text-white py-3 px-6 rounded-xl font-bold">Retry Quiz</button>
        </div>
      `;
      if (result.passed) showNotification(`🎉 Certificate generated: ${result.certId}`);
      else showNotification('📚 Quiz score below 70% (7/10). Retry!', 'error');
    };

    document.getElementById('submit-quiz').style.display = 'none'; // Hide old

    window.closeQuiz = () => document.getElementById('quiz-modal').classList.add('hidden');

    function showNotification(msg, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fixed top-4 right-4 p-4 rounded-2xl shadow-2xl z-50 transform translate-x-full transition-all ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'} text-white font-semibold`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      
      setTimeout(() => toast.classList.remove('translate-x-full'), 100);
      setTimeout(() => {
        toast.classList.add('translate-x-full');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
