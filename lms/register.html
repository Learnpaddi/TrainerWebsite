<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="images/IcoLogo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LearnPaddi LMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 space-y-8">
    <!-- Logo -->
    <div class="text-center">
      <img src="../images/Logo.png" alt="LearnPaddi" class="h-14 mx-auto mb-4">
      <h1 class="text-3xl font-black bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Create Account</h1>
      <p class="text-gray-600">Join LearnPaddi and start learning today</p>
    </div>

    <!-- Form -->
    <form id="register-form" class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
        <input type="text" id="reg-name" required class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50" placeholder="John Doe">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
        <input type="email" id="reg-email" required class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50" placeholder="john@example.com">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
        <input type="password" id="reg-password" required minlength="6" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-primary to-accent text-white font-bold py-5 px-8 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-lg">
        <i class="fas fa-user-plus mr-2"></i> Create Account
      </button>
    </form>

    <!-- Google Button -->
    <div class="relative">
      <div class="absolute inset-0 bg-gray-200 rounded-2xl"></div>
      <div class="relative bg-white text-center">
        <button id="google-register" class="w-full border border-gray-300 px-4 py-3 rounded-2xl font-semibold hover:bg-gray-50 transition-all flex items-center justify-center gap-3 mx-2">
          <i class="fab fa-google text-xl text-gray-700"></i>
          Continue with Google
        </button>
      </div>
    </div>

    <!-- Link to login -->
    <div class="text-center pt-6 border-t border-gray-200">
      <p class="text-gray-600">Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a></p>
    </div>

    <!-- Message -->
    <div id="message" class="hidden p-4 rounded-2xl font-semibold text-center"></div>
  </div>

  <script type="module">
    import * as firebase from './firebase.js';

    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      
      try {
        await firebase.register(email, password, name);
        window.location.href = 'dashboard.html';
      } catch (error) {
        showMessage(errorCodeToMessage(error.code) || 'Registration failed', 'error');
      }
    };

    document.getElementById('google-register').onclick = () => {
      firebase.googleLogin().then(() => {
        window.location.href = 'dashboard.html';
      }).catch(e => showMessage('Google registration failed', 'error'));
    };

    function errorCodeToMessage(code) {
      const messages = {
        'auth/email-already-in-use': 'Email already registered. <a href="login.html">Sign in instead?</a>',
        'auth/weak-password': 'Password too weak (min 6 characters)',
        'auth/invalid-email': 'Invalid email format'
      };
      return messages[code] || `Error: ${code}`;
    }

    function showMessage(html, type) {
      const msg = document.getElementById('message');
      msg.innerHTML = html;
      msg.className = `p-4 rounded-2xl font-semibold text-center ${type === 'error' ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'}`;
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 6000);
    }
    if (window.location.pathname.includes('lms/register.html')) {
      window.location.href = '/register.html';
    }
  </script>
</body>
</html>
