<!-- Mobile Overlay -->
<div class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" id="sidebar-overlay"></div>

<!-- Global Scripts -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebar-toggle');
  const overlay = document.getElementById('sidebar-overlay');
  const dropdown = document.getElementById('user-dropdown');
  const userMenu = document.getElementById('user-menu-dropdown');

  toggle?.addEventListener('click', () => {
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
  });
  
  overlay?.addEventListener('click', () => {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  });

  dropdown?.addEventListener('click', (e) => {
    e.stopPropagation();
    userMenu.classList.toggle('hidden');
  });

  document.addEventListener('click', () => userMenu?.classList.add('hidden'));

  window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024) {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.add('hidden');
      userMenu.classList.add('hidden');
    }
  });
});
</script>

<!-- Firebase Integration -->
<script type="module">
import * as firebase from './firebase.js';

let currentUser = null;

firebase.auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    document.getElementById('user-initials').textContent = (user.displayName || user.email?.[0] || 'U').toUpperCase();
    document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
    document.getElementById('user-email').textContent = user.email;
  }
});

// Removed custom logoutUser - use firebase.logout() globally


// Global search
document.getElementById('global-search')?.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const query = e.target.value;
    window.location.hash = `/courses?search=${encodeURIComponent(query)}`;
  }
});
</script>
