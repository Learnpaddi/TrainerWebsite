<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    body {
      background-color: #2563eb;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      text-align: center;
    }

    .checkmark-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: inline-block;
      stroke-width: 2;
      stroke: #fff;
      stroke-miterlimit: 10;
      margin-bottom: 20px;
      box-shadow: inset 0px 0px 0px #fff;
      animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
      position: relative;
    }

    .checkmark {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.5s;
    }

    @keyframes stroke {
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes scale {
      0%, 100% {
        transform: none;
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes fill {
      100% {
        box-shadow: inset 0px 0px 0px 60px #1e40af;
      }
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    p {
      font-size: 1.1rem;
    }

    a {
      color: #fff;
      text-decoration: underline;
      display: inline-block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <svg class="checkmark-circle" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="25" fill="none" />
      <path class="checkmark" fill="none" stroke="#fff" stroke-width="4" d="M14 27l7 7 16-16" />
    </svg>
    <h1>Thank You!</h1>
    <p>Your message has been received.<br>We’ll contact you shortly.</p>
    <a href="index.html">← Back to Home</a>
  </div>
</body>
</html>
