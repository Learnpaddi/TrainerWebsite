<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - LearnPaddi LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB',
            'primary-light': '#3B82F6',
            accent: '#06B6D4',
            success: '#10B981',
            surface: '0 0% 98%',
            glass: 'rgba(255,255,255,0.1)'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui']
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
            'bounce-slow': 'bounce 2s infinite',
            'spin-slow': 'spin 3s linear infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translate3d(0,0,0)' },
              '50%': { transform: 'translate3d(0,-20px,0)' }
            },
            glow: {
              '0%': { boxShadow: '0 0 20px rgb(37 99 235 / 0.3)' },
              '100%': { boxShadow: '0 0 40px rgb(37 99 235 / 0.6)' }
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .floating-shapes {
      background-image:
        radial-gradient(circle at 20% 50%, rgba(37,99,235,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(6,182,212,0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(16,185,129,0.1) 0%, transparent 50%);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-teal-50 to-blue-50 floating-shapes overflow-x-hidden antialiased">
  
  <!-- Background Shapes -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-gradient-to-r from-emerald-400 to-teal-400/20 rounded-full blur-3xl animate-float opacity-50"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-gradient-to-r from-success to-emerald-400/20 rounded-full blur-3xl animate-[float_8s_ease-in-out_infinite_2s]"></div>
    <div class="absolute top-1/2 left-1/4 w-64 h-64 bg-gradient-to-r from-primary to-accent/30 rounded-full blur-3xl animate-[float_10s_ease-in-out_infinite_4s]"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10">
    <div class="max-w-4xl mx-auto px-6 py-6">
      <div class="flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
          <div class="w-12 h-12 bg-gradient-to-r from-emerald-500 via-success to-teal-500 rounded-2xl shadow-2xl flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-user-plus text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-black bg-gradient-to-r from-gray-900 via-emerald-600 to-success bg-clip-text text-transparent">LearnPaddi</h1>
            <p class="text-sm text-gray-500 font-medium">Join 10K+ Learners</p>
          </div>
        </a>
        <div class="hidden md:flex items-center gap-2 text-sm">
          <a href="login.html" class="px-4 py-2 text-gray-700 font-semibold hover:bg-gray-100 rounded-xl transition-all duration-200">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="relative z-20 flex items-center justify-center min-h-[calc(100vh-12rem)] px-4 py-12">
    <div class="w-full max-w-md space-y-8">
      
      <!-- Main Card -->
      <div class="group">
        <div class="bg-white/85 backdrop-blur-xl border border-emerald-200/50 rounded-3xl p-10 shadow-2xl hover:shadow-3xl transition-all duration-500 group-hover:-translate-y-2 relative overflow-hidden">
          
          <!-- Decorative shine -->
          <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-400/60 to-transparent"></div>
          
          <!-- Logo & Title -->
          <div class="text-center mb-10">
            <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-r from-emerald-500 via-success to-teal-500 rounded-3xl shadow-2xl flex items-center justify-center animate-glow">
              <i class="fas fa-rocket text-2xl text-white"></i>
            </div>
            <div>
              <h1 class="text-4xl font-black bg-gradient-to-r from-gray-900 via-emerald-600 to-success bg-clip-text text-transparent mb-3 leading-tight">
                Start Learning Today
              </h1>
              <p class="text-lg text-gray-600 font-medium max-w-[18rem] mx-auto leading-relaxed">
                Create your free account and unlock 50+ premium courses
              </p>
            </div>
          </div>

          <!-- Form -->
          <form id="register-form" class="space-y-6">
            <div>
              <label class="block text-sm font-semibold text-gray-900 mb-3">Full Name</label>
              <input 
                type="text" 
                id="register-name" 
                required 
                class="w-full px-5 py-4 rounded-2xl bg-white/70 backdrop-blur-sm border-2 border-gray-200/70 hover:border-emerald-400/70 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:outline-none transition-all duration-300 text-lg placeholder-gray-500 font-medium shadow-sm hover:shadow-md hover:-translate-y-px"
                placeholder="John Doe"
              >
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-gray-900 mb-3">Email Address</label>
              <input 
                type="email" 
                id="register-email" 
                required 
                class="w-full px-5 py-4 rounded-2xl bg-white/70 backdrop-blur-sm border-2 border-gray-200/70 hover:border-success/50 focus:border-success focus:ring-4 focus:ring-success/10 focus:outline-none transition-all duration-300 text-lg placeholder-gray-500 font-medium shadow-sm hover:shadow-md hover:-translate-y-px"
                placeholder="john@company.com"
              >
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-gray-900 mb-3">Password</label>
              <div class="relative">
                <input 
                  type="password" 
                  id="register-password" 
                  required 
                  minlength="6"
                  class="w-full pl-12 pr-5 py-4 rounded-2xl bg-white/70 backdrop-blur-sm border-2 border-gray-200/70 hover:border-teal-400/70 focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 focus:outline-none transition-all duration-300 text-lg placeholder-gray-500 font-medium shadow-sm hover:shadow-md hover:-translate-y-px pr-12"
                  placeholder="At least 6 characters"
                >
                <i class="fas fa-eye absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors" onclick="togglePassword(this)"></i>
              </div>
            </div>

            <button 
              type="submit" 
              class="group w-full bg-gradient-to-r from-emerald-500 via-success to-teal-500 text-white font-black py-5 px-8 rounded-3xl shadow-2xl hover:shadow-3xl hover:-translate-y-2 focus:outline-none focus:ring-4 focus:ring-success/20 transition-all duration-300 text-xl flex items-center justify-center gap-3 uppercase tracking-wide letter-spacing-[-0.025em]"
            >
              <i class="fas fa-rocket-launch group-hover:animate-bounce-slow"></i>
              <span>Create My Account</span>
            </button>
          </form>

          <!-- Divider -->
          <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-200/50"></div>
            </div>
            <div class="relative bg-white/85 px-8 text-center text-sm font-medium text-gray-500">
              or continue with
            </div>
          </div>

          <!-- Google Button -->
          <button id="google-register" class="w-full flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-white/85 backdrop-blur-sm border-2 border-gray-200/50 hover:border-emerald-300/50 hover:bg-white hover:shadow-xl hover:-translate-y-1 focus:ring-4 focus:ring-emerald-500/20 focus:outline-none transition-all duration-300 font-semibold text-lg shadow-lg">
            <svg class="w-6 h-6" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </button>

          <!-- Footer -->
          <div class="pt-8 mt-8 border-t border-gray-200/50 text-center">
            <p class="text-sm text-gray-600">
              Already have an account? 
              <a href="login.html" class="font-bold text-emerald-600 hover:text-emerald-700 transition-colors inline-flex items-center gap-1">
                Sign In <i class="fas fa-arrow-right text-xs ml-1"></i>
              </a>
            </p>
          </div>

          <!-- Messages -->
          <div id="message" class="hidden mt-6 p-5 rounded-2xl font-semibold text-center shadow-lg border-l-4 transition-all duration-300 scale-95"></div>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { register, googleLogin, errorCodeToMessage, showMessage } from './lms/firebase-public.js';

    // Form handling
    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Account...';
      btn.disabled = true;
      
      try {
        const name = document.getElementById('register-name').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;
        
        if (name.length < 2) throw new Error('Name too short');
        if (!email.includes('@')) throw new Error('Valid email required');
        if (password.length < 6) throw new Error('Password min 6 chars');
        
        await register(email, password, name);
      } catch (error) {
        showMessage(errorCodeToMessage(error.code) || error.message || 'Registration failed');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    };

    document.getElementById('google-register').onclick = async () => {
      const btn = event.target.closest('button');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Loading...';
      try {
        await googleLogin();
      } catch (e) {
        showMessage('Google sign up failed');
        btn.innerHTML = btn.querySelector('svg').outerHTML + ' Continue with Google';
      }
    };
  </script>

  <script>
    // Password toggle
    window.togglePassword = (icon) => {
      const input = icon.closest('.relative').querySelector('input');
      const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
      input.setAttribute('type', type);
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    };

    // Form validation highlights
    ['register-name', 'register-email', 'register-password'].forEach(id => {
      document.getElementById(id).addEventListener('blur', function() {
        const val = this.value.trim();
        this.classList.toggle('ring-2', val);
        this.classList.toggle('ring-success/30', val);
      });
    });
  </script>
</body>
</html>
