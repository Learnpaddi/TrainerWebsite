<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LearnPaddi</title>
  <!-- LMS + Public Styles -->
  <link rel="stylesheet" href="css/lms.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}, fontFamily: {sans: ['Inter', 'sans-serif']}}}} </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="public-mode bg-gradient-to-br from-emerald-50 to-blue-50 min-h-screen">
  <div id="header-placeholder"></div>
  <script>
    fetch('lms/_header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
        document.getElementById('page-title').textContent = 'Register';
      });
  </script>
  <main class="main-content flex items-center justify-center p-4 min-h-screen">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 space-y-8">
    <!-- Logo -->
    <div class="text-center">
      <a href="/" class="inline-block mb-6"><img src="images/Logo.png" alt="LearnPaddi" class="h-14 mx-auto"></a>
      <h1 class="text-3xl font-black bg-gradient-to-r from-emerald-600 to-primary bg-clip-text text-transparent">Join LearnPaddi</h1>
      <p class="text-gray-600">Create your account to start learning</p>
    </div>

    <!-- Form -->
    <form id="register-form" class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
        <input type="text" id="register-name" required class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50" placeholder="John Doe">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
        <input type="email" id="register-email" required class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50" placeholder="john@example.com">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
        <input type="password" id="register-password" required minlength="6" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-primary text-white font-bold py-5 px-8 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-lg">
        <i class="fas fa-user-plus mr-2"></i> Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="relative text-center text-sm text-gray-500">
      <div class="absolute inset-0 flex items-center">
        <span class="w-full border-t border-gray-200"></span>
      </div>
      <div class="relative bg-white px-4">or continue with</div>
    </div>

    <!-- Google Button -->
    <button id="google-register" class="w-full border border-gray-300 px-4 py-4 rounded-2xl font-semibold hover:bg-gray-50 hover:border-gray-400 transition-all flex items-center justify-center gap-3">
      <i class="fab fa-google text-xl text-gray-700"></i>
      Continue with Google
    </button>

    <!-- Link to login -->
    <div class="text-center pt-6 border-t border-gray-200">
      <p class="text-gray-600">Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a></p>
    </div>

    <!-- Message -->
    <div id="message" class="hidden p-4 rounded-2xl font-semibold text-center"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCPEap7ixlThhtBvPlUJaancN_hPsMNp8Q",
      authDomain: "learnpaddi-1aee9.firebaseapp.com",
      projectId: "learnpaddi-1aee9",
      storageBucket: "learnpaddi-1aee9.firebasestorage.app",
      messagingSenderId: "633908800301",
      appId: "1:633908800301:web:02bda958c51bf6b183c1a4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      
      try {
        const { user } = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(user, { displayName: name });
        await setDoc(doc(db, 'users', user.uid), {
          name, email,
          enrolledCourses: [],
          createdAt: serverTimestamp()
        }, { merge: true });
        window.location.href = '/lms/index.html';  // LMS Homepage
      } catch (error) {
        showMessage(errorCodeToMessage(error.code) || 'Registration failed', 'error');
      }
    };

    document.getElementById('google-register').onclick = async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        // User doc handled in LMS
        window.location.href = '/lms/index.html';
      } catch (e) {
        showMessage('Google registration failed', 'error');
      }
    };

    function errorCodeToMessage(code) {
      const messages = {
        'auth/email-already-in-use': 'Email already registered. <a href="login.html">Login?</a>',
        'auth/weak-password': 'Password too weak (min 6 chars)',
        'auth/invalid-email': 'Invalid email format'
      };
      return messages[code] || `Error: ${code}`;
    }

    function showMessage(html, type) {
      const msg = document.getElementById('message');
      msg.innerHTML = html;
      msg.className = `p-4 rounded-2xl font-semibold text-center ${type === 'error' ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'}`;
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 6000);
    }
  </script>
</body>
</html>
