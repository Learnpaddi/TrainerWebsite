<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Team | Careers</title>
    <script src="https://tailwindcss.com/docs/installation"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("qctLaXnoFtBONFYNO"); // Replace with your EmailJS public key
        })();
    </script>
    <script src="sendmail.js"></script>
    <link rel="stylesheet" href="style1.css">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var form = document.getElementById('careerForm');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    sendMail();
                });
            }
        });
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Application Form -->
            <div class="lg:w-2/3 form-container">
                <form id="careerForm" class="p-6 md:p-8"
                      enctype="multipart/form-data">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Application Form</h2>
                    <!-- Hidden job title field -->
                    <input type="hidden" id="jobTitle" name="Job Title" value="">

                    <!-- Personal Information -->
                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                            <i class="fas fa-user text-blue-500"></i>
                            Personal Information
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name*</label>
                                <input type="text" id="firstName" name="First Name" required class="w-full px-4 py-2 form-input">
                                <p class="text-xs text-red-500 hidden" id="firstNameError">Please enter your first name</p>
                            </div>
                            <div>
                                <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name*</label>
                                <input type="text" id="lastName" name="Last Name" required class="w-full px-4 py-2 form-input">
                                <p class="text-xs text-red-500 hidden" id="lastNameError">Please enter your last name</p>
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email*</label>
                                <input type="email" id="email" name="Email" required class="w-full px-4 py-2 form-input">
                                <p class="text-xs text-red-500 hidden" id="emailError">Please enter a valid email</p>
                            </div>
                            <div>
                                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                                <input type="tel" id="phone" name="Phone" class="w-full px-4 py-2 form-input">
                            </div>
                        </div>
                    </div>

                    <!-- Professional Information -->
                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                            <i class="fas fa-briefcase text-blue-500"></i>
                            Professional Information
                        </h3>
                        <div class="grid grid-cols-1 gap-4">
                            <div>
                                <label for="linkedin" class="block text-sm font-medium text-gray-700 mb-1">LinkedIn Profile</label>
                                <input type="url" id="linkedin" name="LinkedIn" class="w-full px-4 py-2 form-input">
                            </div>
                            <div>
                                <label for="portfolio" class="block text-sm font-medium text-gray-700 mb-1">Portfolio Website</label>
                                <input type="url" id="portfolio" name="Portfolio" class="w-full px-4 py-2 form-input">
                            </div>
                        </div>
                    </div>

                    <!-- Cover Letter -->
                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                            <i class="fas fa-edit text-blue-500"></i>
                            Cover Letter
                        </h3>
                        <div>
                            <label for="coverLetter" class="block text-sm font-medium text-gray-700 mb-1">Tell us why you'd be a great fit*</label>
                            <textarea id="coverLetter" name="Cover Letter" rows="6" required class="w-full px-4 py-2 form-input"></textarea>
                            <p class="text-xs text-red-500 hidden" id="coverLetterError">Please write a cover letter</p>
                        </div>
                    </div>

                    <!-- Additional Questions -->
                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                            <i class="fas fa-question-circle text-blue-500"></i>
                            Additional Questions
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label for="salaryExpectations" class="block text-sm font-medium text-gray-700 mb-1">Salary Expectations</label>
                                <input type="text" id="salaryExpectations" name="Salary Expectations" class="w-full px-4 py-2 form-input">
                            </div>
                            <div>
                                <label for="reference" class="block text-sm font-medium text-gray-700 mb-1">Referred by (if any)</label>
                                <input type="text" id="reference" name="Reference" class="w-full px-4 py-2 form-input">
                            </div>
                        </div>
                    </div>

                    <!-- Terms and Submit -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-start">
                            <input type="checkbox" id="terms" name="terms" required class="mt-1 mr-2">
                            <label for="terms" class="text-sm text-gray-600">
                                I agree to the processing of my personal data according to your <a href="#" class="text-blue-500 hover:underline">Privacy Policy</a>*
                            </label>
                        </div>
                        <p class="text-xs text-red-500 hidden" id="termsError">You must agree to the terms</p>
                        <button type="submit" class="px-6 py-3 rounded-lg text-white font-medium submit-btn w-full sm:w-auto">
                            <i class="fas fa-paper-plane mr-2"></i> Submit Application
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
