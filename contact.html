<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LearnPaddi</title>
    <link rel="icon" href="images/IcoLogo.ico" type="image/x-icon">
    <!-- LMS Styles -->
    <link rel="stylesheet" href="css/lms.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#2563EB', accent: '#06B6D4'}}}}</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="public-mode bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">
    <div id="header-placeholder"></div>
    <script>
      fetch('lms/_header.html')
        .then(r => r.text())
        .then(html => {
          document.getElementById('header-placeholder').innerHTML = html;
          document.getElementById('page-title').textContent = 'Contact';
        });
    </script>
    <main class="main-content">
      <section class="py-24 max-w-4xl mx-auto px-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <a href="index.html" class="flex items-center space-x-3 group">
                    <img src="images/Logo.png" alt="LearnPaddi Logo" class="h-10 w-auto transition-transform group-hover:scale-110">
                    <span class="text-2xl font-bold bg-gradient-to-r from-primary to-indigo-600 bg-clip-text text-transparent">LearnPaddi</span>
                </a>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-lg font-medium text-gray-700 hover:text-primary py-2 relative group transition-colors">Home</a>
                    <a href="aboutus.html" class="text-lg font-medium text-gray-700 hover:text-primary py-2 relative group transition-colors">About</a>
                    <a href="careers.html" class="text-lg font-bold text-primary bg-primary/10 px-6 py-3 rounded-xl hover:bg-primary/20 border border-primary/20 hover:shadow-lg">Careers</a>
                    <a href="login.html" class="text-lg font-semibold text-primary bg-primary/10 px-5 py-3 rounded-xl hover:bg-primary/20 border border-primary/20 hover:shadow-lg">Login</a>
                    <a href="register.html" class="text-lg font-semibold bg-gradient-to-r from-accent to-cyan-500 text-white px-5 py-3 rounded-xl hover:shadow-lg hover:-translate-y-1 transition-all">Register</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="py-32 max-w-4xl mx-auto px-6">
        <div class="text-center mb-20">
            <h1 class="text-5xl md:text-6xl font-black mb-6 bg-gradient-to-r from-gray-900 via-primary to-accent bg-clip-text text-transparent">Contact Us</h1>
            <p class="text-xl md:text-2xl text-gray-600 mb-12 max-w-2xl mx-auto leading-relaxed">Get in touch for partnerships, training programs, or questions</p>
        </div>

        <form id="contactForm" class="bg-white rounded-3xl shadow-2xl p-12 space-y-8 max-w-2xl mx-auto">
            <div class="grid md:grid-cols-2 gap-6">
                <input type="text" name="name" placeholder="Full Name *" required class="w-full px-6 py-5 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50 text-lg">
                <input type="tel" name="phone" placeholder="Phone *" required class="w-full px-6 py-5 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50 text-lg">
            </div>
            <input type="email" name="email" placeholder="Email Address *" required class="w-full px-6 py-5 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50 text-lg">
            <input type="text" name="organization" placeholder="Organization/Institute *" class="w-full px-6 py-5 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50 text-lg">
            <textarea name="message" rows="6" placeholder="Tell us about your training needs..." required class="w-full px-6 py-5 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-gray-50 text-lg resize-vertical"></textarea>
            <button type="submit" class="w-full bg-gradient-to-r from-primary to-accent text-white font-bold py-6 px-8 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 text-xl">
                <i class="fas fa-paper-plane mr-3"></i> Send Message
            </button>
        </form>

        <div class="grid md:grid-cols-2 gap-12 mt-24 text-center">
            <div class="p-12 bg-gradient-to-br from-emerald-50 to-teal-50 rounded-3xl">
                <i class="fas fa-phone text-4xl text-emerald-600 mb-6"></i>
                <h3 class="text-2xl font-bold mb-4 text-gray-900">Call Us</h3>
                <p class="text-xl font-semibold text-gray-700">+91 98765 43210</p>
            </div>
            <div class="p-12 bg-gradient-to-br from-purple-50 to-indigo-50 rounded-3xl">
                <i class="fas fa-envelope text-4xl text-purple-600 mb-6"></i>
                <h3 class="text-2xl font-bold mb-4 text-gray-900">Email</h3>
                <p class="text-xl font-semibold text-gray-700">contact@learnpaddi.in</p>
            </div>
        </div>
    </section>

    <footer class="bg-gradient-to-r from-gray-900 to-gray-800 text-white py-16 mt-24">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <a href="index.html" class="flex items-center justify-center space-x-3 mb-8 mx-auto">
                <img src="images/Logo.png" alt="LearnPaddi" class="h-12">
            </a>
            <div class="text-gray-400 text-sm mb-8">© 2025 LearnPaddi. All rights reserved. | 
                <a href="privacy.html" class="hover:text-white mr-1">Privacy</a> | 
                <a href="terms.html" class="hover:text-white mr-1">Terms</a> | 
                <a href="help.html" class="hover:text-white">Help</a> | 
                MSME Registered</div>
            <div class="flex justify-center space-x-6">
                <a href="https://www.linkedin.com/company/learnpaddi" class="w-12 h-12 bg-white/20 hover:bg-white rounded-xl flex items-center justify-center transition-all hover:scale-110"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://x.com/LearnPaddi" class="w-12 h-12 bg-white/20 hover:bg-white rounded-xl flex items-center justify-center transition-all hover:scale-110"><i class="fab fa-x-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script>
        emailjs.init("syYXMk4nEOCWRN-4f");
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            emailjs.sendForm('service_wf8q2fi', 'template_wetb0ki', this).then(() => {
                alert('Thank you! We will contact you soon.');
                this.reset();
            }, () => alert('Submission failed. Try again.'));
        });
    </script>
</body>
